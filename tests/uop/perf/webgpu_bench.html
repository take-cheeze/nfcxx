<!doctype html>
<!-- Times tinygrad's WGSL kernels (bench_cases.js, written by gen_webgpu.py) on WebGPU. Per case: 3 warm-up runs, then 10
     timed runs of the whole kernel sequence. A run submits the kernels and maps one float of the output, which waits for
     the queue, so each timing includes the GPU work and the scalar readback. Results are logged as PERF lines (stderr
     with --enable-logging=stderr); PERF_DONE marks the end. -->
<html>
<head><meta charset="utf-8"><title>tinygrad WebGPU bench</title></head>
<body>
<pre id="log">running</pre>
<script src="bench_cases.js"></script>
<script>
(async () => {
  const log = (s) => console.log(s);
  const fail = (s) => { console.log('PERF_ERROR ' + s); console.log('PERF_DONE'); };
  try {
    if (!navigator.gpu) return fail('no navigator.gpu');
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) return fail('no adapter');
    const info = adapter.info ? adapter.info.vendor + '/' + adapter.info.architecture : 'unknown';
    log('PERF_ADAPTER ' + info + ' ua=' + navigator.userAgent);
    const device = await adapter.requestDevice({
      requiredLimits: { maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
                        maxBufferSize: adapter.limits.maxBufferSize } });
    const U = GPUBufferUsage;
    const median = (a) => { const s = a.slice().sort((x, y) => x - y); return s[s.length >> 1]; };
    const RUNS = 10, WARM = 3;
    for (const c of window.BENCH_CASES) {
      const bufs = {};
      for (const [name, count] of Object.entries(c.buffers)) {
        bufs[name] = device.createBuffer({ size: count * 4, usage: U.STORAGE | U.COPY_SRC | U.COPY_DST });
        if (name.startsWith('in')) {
          const data = new Float32Array(count);
          for (let i = 0; i < count; i++) data[i] = 0.5 + ((i * 2654435761) >>> 0) / 4294967296;
          device.queue.writeBuffer(bufs[name], 0, data);
        }
      }
      const inf = device.createBuffer({ size: 16, usage: U.UNIFORM | U.COPY_DST });
      device.queue.writeBuffer(inf, 0, new Float32Array([Infinity, 0, 0, 0]));
      const readback = device.createBuffer({ size: 4, usage: U.MAP_READ | U.COPY_DST });
      const prepared = [];
      device.pushErrorScope('validation');
      for (const k of c.kernels) {
        const module = device.createShaderModule({ code: k.source });
        const pipeline = device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint: k.entry } });
        const entries = k.binds.map((b) => ({ binding: b.binding, resource: { buffer: b.uniform ? inf : bufs[b.buf] } }));
        prepared.push({ pipeline, bindGroup: device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries }), dispatch: k.dispatch });
      }
      const err = await device.popErrorScope();
      if (err) { log('PERF_ERROR ' + c.op + ' ' + c.size + ': ' + err.message); continue; }
      const outBuf = bufs[c.output];
      const runOnce = async () => {
        const t0 = performance.now();
        const enc = device.createCommandEncoder();
        for (const p of prepared) {
          const pass = enc.beginComputePass();
          pass.setPipeline(p.pipeline); pass.setBindGroup(0, p.bindGroup);
          pass.dispatchWorkgroups(p.dispatch[0], p.dispatch[1], p.dispatch[2]);
          pass.end();
        }
        enc.copyBufferToBuffer(outBuf, 0, readback, 0, 4);
        device.queue.submit([enc.finish()]);
        await readback.mapAsync(GPUMapMode.READ);
        readback.getMappedRange(); readback.unmap();
        return performance.now() - t0;
      };
      for (let i = 0; i < WARM; i++) await runOnce();
      const ts = [];
      for (let i = 0; i < RUNS; i++) ts.push(await runOnce());
      log('PERF ' + JSON.stringify({ backend: c.backend || 'tinygrad-webgpu', op: c.op, size: c.size, kernels: c.kernels.length,
        ms: Math.round(median(ts) * 1000) / 1000, min: Math.round(Math.min(...ts) * 1000) / 1000, adapter: info }));
    }
  } catch (e) {
    log('PERF_ERROR ' + (e && e.message ? e.message : e));
  }
  log('PERF_DONE');
})();
</script>
</body>
</html>
