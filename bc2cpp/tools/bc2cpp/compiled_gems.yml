# The bc2cpp-generated gems, one per `*-compiled` mrbgem, in iteration order.
# Read and validated by compiled_gems_config.rb. owners are derived from source, never listed here.
#   owners_from        `mruby-<base gem>` (its mrblib) or `core` (mruby's own classes)
#   out_symbol         prefix of the gem's generated <out_symbol>_gen.cpp; unique across gems
#   native_namespaces  (optional) namespaces whose native registrations are removed when left out
version: 1
gems:
  mruby-lcf-compiled:
    owners_from: mruby-lcf
    out_symbol: lcf_compiled
    native_namespaces: [LCF]
  mruby-rpg2k-compiled:
    owners_from: mruby-rpg2k
    out_symbol: rpg2k_compiled
    native_namespaces: [Game, RPG2k, RPG2k3]
  mruby-rgss-compiled:
    owners_from: mruby-rgss
    out_symbol: rgss_compiled
    native_namespaces: [RGSS]
  mruby-core-compiled:
    owners_from: core
    out_symbol: core_compiled
