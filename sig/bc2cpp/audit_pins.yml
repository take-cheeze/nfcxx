# Audit pins for the engine sources this repository owns. bc2cpp reads them through
# 3rd/nfcxx/bc2cpp/tools/bc2cpp/world_audit_pins.rb. A digest is the SHA-256 of the file's bytes: an audit counts a
# file only while its digest is listed. Re-check the claims before changing a digest;
# scripts/bc2cpp/audit_pins_check.rb fails on a stale one.
ivar_scopes:
