name: bc2cpp

# bc2cpp (bc2cpp/, the mruby-to-C++ compiler moved from rpg-maker-clone, docs/notes/bc2cpp-migration.md) compiling the
# worlds under tests/bc2cpp/ (one tests/bc2cpp/run_<world>.sh per world: optcarrot, then nfcxx's own Ruby scripts, one
# world each, listed in tests/bc2cpp/worlds.list and run three to a job) against a pinned
# rpg-maker-clone checkout (tests/bc2cpp/fetch.sh). Runs when bc2cpp, a world or the pin changes, and on demand.
# It needs only the host compiler and Ruby 4.0, not the EDG toolchain.
on:
  push:
    branches: [main]
    paths:
      - "bc2cpp/**"
      - "tests/bc2cpp/**"
      - "scripts/pathb-qbe-emit.rb"
      - "Gemfile"
      - "Gemfile.lock"
      - "scripts/pathb-borrowck.rb"
      - "tests/pathb-borrow/**"
      - "be/nfcxx_*.c"
      - "scripts/nfcxx-*"
      - "scripts/setup-libclang-edg.sh"
      - "scripts/build-libclang-edg.sh"
      - "scripts/setup-edg.sh"
      # The submodules and scripts the nfcxx-clang-parity job builds from (the toolchain action's cache keys): a bump
      # of EDG, QBE or cproc, or a change to their setup, must re-run the parity check.
      - "3rd/edg"
      - "3rd/qbe"
      - "3rd/cproc"
      - "scripts/setup-qbe.sh"
      - "scripts/qbe-*.patch"
      - "scripts/cproc-*.patch"
      - "scripts/pathb-ldrt"
      - "be/nfcxx_*.h"
      - ".github/actions/toolchain/**"
      - ".github/workflows/bc2cpp.yml"
  pull_request:
    paths:
      - "bc2cpp/**"
      - "tests/bc2cpp/**"
      - "scripts/pathb-qbe-emit.rb"
      - "Gemfile"
      - "Gemfile.lock"
      - "scripts/pathb-borrowck.rb"
      - "tests/pathb-borrow/**"
      - "be/nfcxx_*.c"
      - "scripts/nfcxx-*"
      - "scripts/setup-libclang-edg.sh"
      - "scripts/build-libclang-edg.sh"
      - "scripts/setup-edg.sh"
      # The submodules and scripts the nfcxx-clang-parity job builds from (the toolchain action's cache keys): a bump
      # of EDG, QBE or cproc, or a change to their setup, must re-run the parity check.
      - "3rd/edg"
      - "3rd/qbe"
      - "3rd/cproc"
      - "scripts/setup-qbe.sh"
      - "scripts/qbe-*.patch"
      - "scripts/cproc-*.patch"
      - "scripts/pathb-ldrt"
      - "be/nfcxx_*.h"
      - ".github/actions/toolchain/**"
      - ".github/workflows/bc2cpp.yml"
  # Only mrbc-snapshot runs on the schedule (the fork's mrbc moves with the pinned world: drift must show without a change here).
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      mrbc_rb:
        description: "BC2CPP_MRBC_RB for every world/checks job: snapshot, verify, or record (= verify plus BC2CPP_MRBC_SNAPSHOT_RECORD; the record files are uploaded as artifacts for snapshot.rb --update --from-record)"
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The worlds (tests/bc2cpp/worlds.list), three shards: a shard runs its worlds one after another in this job
  # (tests/bc2cpp/run_worlds.rb balances them by the list's weights, runs every world even after one fails, and prints a
  # per-world summary), so the checkout, Ruby, the build tools and the fetched world are paid for once per shard, not once per
  # world. A new world goes in worlds.list; raise the shard count here and in --shard when the shards outgrow the timeout.
  world:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      # No submodules: the worlds build from the pinned rpg-maker-clone checkout, not from 3rd/.
      - uses: actions/checkout@v7

      # Ruby 4.0 ships the Prism 1.x and RBS 4.x that bc2cpp is written against; the runner image's Ruby is older.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      # bison and gperf for the fork's mruby build, autoconf and automake for Onigmo (mruby-onig-regexp), gdb for a
      # crash's backtrace (tests/bc2cpp/run_optcarrot.sh).
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bison gperf autoconf automake libtool gdb

      # -O2: the runner's Ubuntu g++ 13.3 miscompiles the -O3 build (SIGILL inside a call to bc2cpp_hint_violation that
      # is never entered); Debian's 13.5 and -O2 both pass.
      - name: bc2cpp worlds, shard ${{ matrix.shard }} of 3
        env:
          OPTCARROT_COMPILED_FLAGS: -O2
          # The Ruby emitter is the default compiler. Every world runs verify (it also runs the fork's mrbc and fails on any
          # byte difference) unless worlds.list names another mode or a dispatch's mrbc_rb input replaces it (snapshot compares
          # with what that mrbc once wrote, bc2cpp/tools/mrbc_rb/snapshot*.txt, and aborts on an input that is not in the table:
          # dispatch with mrbc_rb=record, then snapshot.rb --update --from-record on the artifact).
          BC2CPP_MRBC_RB_OVERRIDE: ${{ inputs.mrbc_rb }}
          BC2CPP_MRBC_RECORD_DIR: ${{ runner.temp }}
        run: ruby tests/bc2cpp/run_worlds.rb --shard ${{ matrix.shard }}/3

      - name: Upload the snapshot records
        if: always() && inputs.mrbc_rb == 'record'
        uses: actions/upload-artifact@v4
        with:
          name: mrbc-record-worlds-${{ matrix.shard }}
          path: ${{ runner.temp }}/mrbc-record-*.txt
          if-no-files-found: ignore

  # mrbc_rb (bc2cpp/tools/mrbc_rb): the Ruby RITE emitter, compared byte for byte with the fork's mrbc -g built from the
  # pinned world, then the command line (bin/mrbc_rb: all output formats, on every gem's mrblib set and every bc2cpp
  # source, and the `-v` listing; ~3 min together, so run in full rather than sampled) and bc2cpp's loader through it. tests/bc2cpp/run_mrbc_rb.sh runs
  # the tests against one oracle build. Uses the root Gemfile's Prism 1.9.0 under Ruby 4.0.
  mrbc-rb:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bison gperf autoconf automake libtool

      - name: Golden, CLI and integration tests against the fork's mrbc
        run: tests/bc2cpp/run_mrbc_rb.sh

  # mrbc-snapshot: the oracle-free verification. bc2cpp/tools/mrbc_rb/snapshot.txt (and snapshot_world.txt for the inputs of the pinned
  # world; the world commit in its header is informational, a pin bump alone does not fail: keys are content hashes) records, per input (content hash of the file
  # set), the hash of what the fork's mrbc -g wrote. This job is the one that has the oracle: it builds it once at the pinned
  # world, checks that every input the tests and the pinned world enumerate is in the table and still gives the recorded value
  # (drift of the fork or an incomplete table fails), then runs the emitter tests with NO mrbc, against the table. Jobs that
  # do not need to build mrbc can use BC2CPP_MRBC_RB=snapshot instead of verify. Scheduled too: the fork's mrbc moves with the
  # pinned world (tests/bc2cpp/fetch.sh), and a stale table must show up without anyone touching bc2cpp.
  mrbc-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bison gperf autoconf automake libtool

      - name: Build the oracle once and check the snapshot against it
        run: |
          set -eu
          root=$PWD
          . tests/bc2cpp/fetch.sh
          bc2cpp_fetch
          (cd "$bc2cpp_root/3rd/mruby" && env -u LD BUNDLE_GEMFILE="$root/Gemfile" bundle exec rake -j"$(nproc)") > build/bc2cpp/snapshot-oracle.log 2>&1 ||
            { tail -20 build/bc2cpp/snapshot-oracle.log; exit 1; }
          echo "BC2CPP_RPG_DIR=$bc2cpp_root" >> "$GITHUB_ENV"
          echo "ORACLE=$bc2cpp_root/3rd/mruby/bin/mrbc" >> "$GITHUB_ENV"
          MRBC="$bc2cpp_root/3rd/mruby/bin/mrbc" BC2CPP_RPG_DIR="$bc2cpp_root" bundle exec ruby bc2cpp/tools/mrbc_rb/snapshot.rb --check

      - name: Golden and CLI tests against the snapshot (no mrbc in the environment)
        run: |
          unset MRBC
          export BC2CPP_NO_MRBC=1
          bundle exec ruby bc2cpp/tools/mrbc_rb/golden_test.rb
          # cli_test starts bin/mrbc_rb once per input (about 0.2 s each): every 10th input keeps the step to a few minutes.
          MRBC_RB_CLI_SAMPLE=10 bundle exec ruby bc2cpp/tools/mrbc_rb/cli_test.rb
          bundle exec ruby bc2cpp/tools/mrbc_rb/snapshot.rb --verify
          bundle exec ruby bc2cpp/tools/mrbc_rb/snapshot_test.rb

  # bc2cpp's fixture checks (bc2cpp/scripts/bc2cpp/checks.list), three shards, moved from rpg-maker-clone's
  # bc2cpp-checks job. They run inside the pinned world (tests/bc2cpp/fetch.sh), whose bc2cpp paths reach this checkout
  # through its 3rd/nfcxx, with the world's own Nix dev shell, so the commands and their toolchain are unchanged.
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      RUBY_YJIT_ENABLE: "1"
      BC2CPP_WORLD_FULL: "1"
      # The Ruby emitter is the default compiler; verify also runs the fork's mrbc and fails on any byte difference. Stays on verify:
      # the fixtures compile generated programs (measured on 24 checks: 64 distinct inputs, none in the snapshot table). A dispatch with
      # mrbc_rb=record also writes the inputs of each check to a record file (uploaded below) for snapshot.rb --update --from-record.
      BC2CPP_MRBC_RB: ${{ (inputs.mrbc_rb == 'record' && 'verify') || inputs.mrbc_rb || 'verify' }}
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7

      # The runner context is not available in a job-level env, so the record path is exported from a step.
      - name: Snapshot record path
        if: inputs.mrbc_rb == 'record'
        run: echo "BC2CPP_MRBC_SNAPSHOT_RECORD=$RUNNER_TEMP/mrbc-record-checks-${{ matrix.shard }}.txt" >> "$GITHUB_ENV"

      - name: World checkout
        run: tests/bc2cpp/world.sh

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-bc2cpp-${{ runner.os }}-${{ hashFiles('build/bc2cpp/rpg-maker-clone/flake.*') }}
          restore-prefixes-first-match: nix-bc2cpp-${{ runner.os }}-

      - name: Set up development environment
        working-directory: build/bc2cpp/rpg-maker-clone
        run: ./scripts/nix/develop-export-env.bash .#bc2cpp

      - name: Verify host Ruby JIT
        run: ruby -e 'abort "YJIT is unavailable or disabled" unless RubyVM::YJIT.enabled?; puts RUBY_DESCRIPTION'

      # Keyed on content digests, so a stale restore is recomputed rather than trusted.
      - name: Cache bc2cpp scan cache
        uses: actions/cache@v6
        with:
          path: build/bc2cpp/rpg-maker-clone/build/bc2cpp-cache
          key: bc2cpp-scan-cache-${{ hashFiles('bc2cpp/tools/bc2cpp/*.rb') }}
          restore-keys: bc2cpp-scan-cache-

      - name: Key for the fixture libmruby caches
        id: lib-key
        working-directory: build/bc2cpp/rpg-maker-clone
        run: |
          echo "mruby=$(git rev-parse HEAD:3rd/mruby)" >> "$GITHUB_OUTPUT"
          echo "stringio=$(git rev-parse HEAD:3rd/mruby-stringio)" >> "$GITHUB_OUTPUT"
      - name: Cache the full-core libmruby build
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bc2cpp-full
          key: bc2cpp-full-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/bc2cpp/rpg-maker-clone/flake.*') }}-${{ steps.lib-key.outputs.mruby }}-${{ steps.lib-key.outputs.stringio }}-${{ hashFiles('bc2cpp/scripts/bc2cpp/fixture_runtime.rb', 'build/bc2cpp/rpg-maker-clone/scripts/mruby/**', 'bc2cpp/scripts/bc2cpp/*.bash', 'build/bc2cpp/rpg-maker-clone/patches/mruby*.patch') }}
      # The same libmruby without mruby-fiber, for native_fiber_check (the C++ Fiber as the only Fiber).
      - name: Cache the no-fiber libmruby build
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bc2cpp-nofiber
          key: bc2cpp-nofiber-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/bc2cpp/rpg-maker-clone/flake.*') }}-${{ steps.lib-key.outputs.mruby }}-${{ hashFiles('bc2cpp/scripts/bc2cpp/fixture_runtime.rb', 'build/bc2cpp/rpg-maker-clone/scripts/mruby/**', 'build/bc2cpp/rpg-maker-clone/mruby-fiber-placeholder/**', 'bc2cpp/scripts/bc2cpp/*.bash', 'build/bc2cpp/rpg-maker-clone/patches/mruby*.patch') }}

      - name: Prepare shared check libraries
        working-directory: build/bc2cpp/rpg-maker-clone
        run: |
          env -u LD BC2CPP_FULL_BUILD_DIR="$RUNNER_TEMP/bc2cpp-full" ruby -r ./scripts/bc2cpp/fixture_runtime -e 'abort "full-core mruby unavailable" unless Bc2cppFixtureRuntime.full_or_build'
          env -u LD BC2CPP_NOFIBER_BUILD_DIR="$RUNNER_TEMP/bc2cpp-nofiber" ruby -r ./scripts/bc2cpp/fixture_runtime -e 'abort "no-fiber mruby unavailable" unless Bc2cppFixtureRuntime.nofiber_or_build'
          echo "MRBC=$RUNNER_TEMP/bc2cpp-full/host/bin/mrbc" >> "$GITHUB_ENV"
          echo "BC2CPP_MRUBY_FULL=$RUNNER_TEMP/bc2cpp-full/host" >> "$GITHUB_ENV"
          echo "BC2CPP_MRUBY_NOFIBER=$RUNNER_TEMP/bc2cpp-nofiber/host" >> "$GITHUB_ENV"
          echo "BC2CPP_BUILD_INCLUDE=$RUNNER_TEMP/bc2cpp-full/host/include" >> "$GITHUB_ENV"

      # The world's registry: every check in the policy is scheduled somewhere (checks.list included).
      - name: Check bc2cpp registrations
        working-directory: build/bc2cpp/rpg-maker-clone
        run: ruby scripts/ci/check_registry.rb

      - name: Run bc2cpp checks
        timeout-minutes: 30
        working-directory: build/bc2cpp/rpg-maker-clone
        run: |
          unset LD
          ruby scripts/ci/timed_checks.rb --shard ${{ matrix.shard }}/3 < scripts/bc2cpp/checks.list > "$RUNNER_TEMP/bc2cpp-checks.sh"
          source "$RUNNER_TEMP/bc2cpp-checks.sh"

      - name: Upload the snapshot record
        if: always() && inputs.mrbc_rb == 'record'
        uses: actions/upload-artifact@v4
        with:
          name: mrbc-record-checks-${{ matrix.shard }}
          path: ${{ runner.temp }}/mrbc-record-checks-${{ matrix.shard }}.txt
          if-no-files-found: ignore

  # nfcxx (the EDG front end) against clang inside bc2cpp: both AST producers (return kinds, and the host program's main_ast roots) and both
  # preprocessors (and the analysis headers' presym ids) on the pinned world's mruby, and the C++ Fiber check compiled with nfcxx (tests/bc2cpp/run_nfcxx_parity.sh, docs/notes/nfcxx-ast.md). The
  # toolchain action restores build/edg, build/qbe and build/cproc from the cache that ci.yml's build job saves (same keys,
  # so the checkout path must stay the same). The AST front end (scripts/setup-libclang-edg.sh) is a separate EDG
  # configuration, cached below. The checkout takes only the submodules those need.
  nfcxx-clang-parity:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      NFCXX_PARITY_FIBER: "1"
    steps:
      - uses: actions/checkout@v7

      - name: EDG, QBE and cproc sources
        run: git submodule update --init --depth 1 3rd/edg 3rd/qbe 3rd/cproc

      # clang: the oracle of the parity checks (nfcxx is the default AST producer, preprocessor and host compiler wherever it is
      # built; clang stays installed only here, and is the fallback elsewhere). bison, gperf, autoconf, automake and libtool: the fork's mruby build
      # (the Fiber check).
      - uses: ./.github/actions/toolchain
        with:
          packages: clang bison gperf autoconf automake libtool

      # Ruby 4.0 ships the Prism 1.x and RBS 4.x that bc2cpp is written against (see the world job).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # build/libclang-edg, keyed as ci.yml keys the Path B harness: the EDG revision and what the build reads.
      - name: AST front end cache key
        id: libclang-key
        run: echo "edg=$(git rev-parse HEAD:3rd/edg)" >> "$GITHUB_OUTPUT"

      - name: Restore the AST front end
        id: libclang-edg
        uses: actions/cache@v6
        with:
          path: build/libclang-edg
          key: libclang-edg-${{ runner.os }}-${{ runner.arch }}-${{ steps.libclang-key.outputs.edg }}-${{ hashFiles('be/nfcxx_decl.c', 'be/nfcxx_ast.c', 'be/nfcxx_edg_entry.c', 'scripts/setup-libclang-edg.sh', 'scripts/build-libclang-edg.sh', 'scripts/setup-edg.sh') }}

      - name: Build the AST front end
        if: steps.libclang-edg.outputs.cache-hit != 'true'
        run: LIBCLANG_EDG_IN_PROCESS=0 scripts/setup-libclang-edg.sh

      - name: nfcxx against clang (AST producers, main_ast, preprocessors, C++ Fiber)
        run: tests/bc2cpp/run_nfcxx_parity.sh

      - name: sccache stats
        if: always()
        run: sccache --show-stats
