name: swiftfe

# Builds the LLVM-free Swift frontend in tools/swiftfe and runs its unit and integration
# suites. The integration programs are checked against the stored output of the real
# Swift compiler (tests/integration/programs/*.expected), so no swiftc is needed here.
on:
  pull_request:
    paths:
      - "tools/swiftfe/**"
      - ".github/workflows/swiftfe.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/swiftfe
    steps:
      - uses: actions/checkout@v7

      # setup-swift verifies the toolchain's signature against keys it refreshes from keyserver.ubuntu.com, and a failed
      # refresh ends the step ("Failed to refresh keys from any server in the pool", twice on 2026-11-11, once after
      # a connection timeout of 8 minutes). The action has no retry of its own: the first attempt may fail, and then one
      # more is made after a pause. The signature check stays on.
      - name: Install Swift toolchain
        id: swift_first
        uses: swift-actions/setup-swift@v2
        continue-on-error: true
        with:
          swift-version: "6.0"

      - name: Wait before the second Swift attempt
        if: steps.swift_first.outcome == 'failure'
        run: sleep 60

      - name: Install Swift toolchain (second attempt)
        if: steps.swift_first.outcome == 'failure'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build
        run: swift build -c release

      - name: Unit tests
        run: sh tests/run.sh

      - name: Integration tests
        run: sh tests/integration/run.sh
