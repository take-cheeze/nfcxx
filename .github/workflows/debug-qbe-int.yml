name: Debug qbe rejection (temporary)
on:
  push:
    branches: [claude/cpp-coverage-nightly-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/upstream-toolchain
        with:
          pathb: "false"
      - name: Toolchain versions
        run: |
          cc --version | head -1
          readlink -f "$(command -v cc)"
          g++-15 --version | head -1
      - name: Probe with kept intermediates
        env:
          FEATURE_ROUTES: qbe
          FEATURE_OUT: build/dbg
          FEATURE_TIMEOUT: "900"
          NFCXX_KEEP_INTERMEDIATES: "1"
        run: |
          # A copy of the driver whose eccp call keeps the generated C (eccp -k).
          sed 's/"\$eccp_bin" "\$std"/"$eccp_bin" --keep_gen_c "$std"/' nfcxx > nfcxx-dbg && chmod +x nfcxx-dbg
          grep -c keep_gen_c nfcxx-dbg
          FEATURE_CXX="$PWD/nfcxx-dbg" tests/cpp-features/run.sh || true
      - name: Reproduce the back end on the kept C
        run: |
          set -x
          probe=cpp11-N2634-sfinae_expressions
          out=build/dbg-c; rm -rf "$out"; mkdir -p "$out"
          kept=$(sed -n 's/.*intermediates kept in \([^ ]*\).*/\1/p' build/dbg/$probe/qbe/compile.log | head -1)
          echo "kept dir: $kept" > "$out/kept.txt"
          cp -r "$kept"/. "$out"/
          ls -la "$out"
          cd "$out"
          ../../scripts/qbe-cc -c $probe.int.c -o kept.o > qbe-cc.log 2>&1; echo "qbe-cc exit $?" >> qbe-cc.log
          ../cproc/cproc-qbe $probe.int.c > kept.ssa 2> cproc.log; echo "cproc exit $?" >> cproc.log
          ../qbe/qbe kept.ssa > /dev/null 2> qbe.log; echo "qbe exit $?" >> qbe.log
          cc -E -undef -D__CPROC__ $probe.int.c > kept.pp.c 2> cpp.log; echo "cc -E exit $?" >> cpp.log
          cc --version | head -1 > cc-version.txt
          cat qbe-cc.log qbe.log
          cat -n kept.ssa | sed -n 1,40p
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-qbe-${{ github.run_attempt }}
          path: |
            build/dbg
            build/dbg-c
          retention-days: 7
          if-no-files-found: warn
