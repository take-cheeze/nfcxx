name: Debug qbe rejection (temporary)
on:
  push:
    branches: [claude/cpp-coverage-nightly-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/upstream-toolchain
        with:
          pathb: "false"
      - name: Toolchain versions
        run: |
          cc --version | head -1
          readlink -f "$(command -v cc)"
          g++-15 --version | head -1
      - name: Probe with kept intermediates
        env:
          FEATURE_ROUTES: qbe
          FEATURE_OUT: build/dbg
          FEATURE_TIMEOUT: "900"
          NFCXX_KEEP_INTERMEDIATES: "1"
        run: tests/cpp-features/run.sh || true
      - name: Regenerate the front-end C and reproduce the back end
        run: |
          set -x
          probe=cpp11-N2634-sfinae_expressions
          src=$PWD/tests/cpp-features/cpp11/$probe.cpp
          out=$PWD/build/dbg-c; mkdir -p "$out"
          line=$(sed -n 's/^C++ prelinker: executing: [^ ]*eccp.sh //p' build/dbg/$probe/qbe/compile.log | head -1)
          echo "prelinker args: $line" > "$out/args.txt"
          (cd "$out" && eval "$PWD/../edg/bin/eccp --keep_gen_c $line") > "$out/eccp.log" 2>&1 || echo "eccp exit $?" >> "$out/eccp.log"
          cp "$out"/*.int.c "$out/kept.int.c" 2>/dev/null || true
          cd "$out"
          ../../scripts/qbe-cc -c kept.int.c -o kept.o > qbe-cc.log 2>&1; echo "qbe-cc exit $?" >> qbe-cc.log
          ../cproc/cproc-qbe kept.int.c > kept.ssa 2> cproc.log; echo "cproc exit $?" >> cproc.log
          ../qbe/qbe kept.ssa > /dev/null 2> qbe.log; echo "qbe exit $?" >> qbe.log
          cc -E -undef -D__CPROC__ kept.int.c > kept.pp.c 2> cpp.log; echo "cc -E exit $?" >> cpp.log
          cc --version | head -1 > cc-version.txt
          cat qbe-cc.log qbe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-qbe-${{ github.run_attempt }}
          path: |
            build/dbg
            build/dbg-c
          retention-days: 7
          if-no-files-found: warn
