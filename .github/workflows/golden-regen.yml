name: golden regen (temporary)
on:
  pull_request:
    paths: ["tests/pathb-ir/**", "tests/cases/**", ".github/workflows/golden-regen.yml"]
jobs:
  regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/toolchain
        with:
          packages: python3 ruby rake
      - name: Path B harness
        run: scripts/setup-pathb.sh
      - name: Regenerate the IR goldens
        run: tests/pathb-ir/run.sh --update
      - uses: actions/upload-artifact@v4
        with:
          name: pathb-ir-goldens
          path: tests/pathb-ir/*.ir
