name: Path B

# Path B checks (docs/notes/pathb-stage1.md to pathb-stage3.md; a build job makes the harness and the mruby tool, and
# the suites run in parallel from their caches): the harness cpfe whose back end is be/nfcxx_*.c
# (scripts/setup-pathb.sh), the IR goldens, and the IR -> QBE emitter run by the mruby interpreter. Building the
# harness compiles the whole EDG front end a second time, so this is kept out of the main CI job and runs only when
# a change can affect it. Runs on demand too (workflow_dispatch).
#
#   tests/pathb/run.sh       stage 1 IL goldens (tests/pathb/*.il)
#   tests/pathb-ir/run.sh    stage 2 IR goldens (tests/pathb-ir/*.ir) and node coverage
#   tests/pathb-qbe/run.sh   stage 3 translation validation: IR -> QBE -> run, against EXPECT and the gcc backend
#   tests/wasm/run.sh        the wasm emitter (scripts/pathb-wasm-emit.rb): IR -> wasm, run under node, against EXPECT
#   tests/pathb-qbe/hosted.sh  hosted Path B (NFCXX_PATH=b driver, hosted probes, tinyxml2)
#   tests/ehshim/run.sh      the EH shim (lib/ehshim): libstdc++ exceptions and exception_ptr on gcc, qbe and Path B
#   tests/safeptr/run.sh     -fsafe-pointers (lib/safeptr, docs/notes/safe-pointers.md), and the Path B probes under it
#   tests/mruby/run.sh       the mruby ports against their Python oracles, with the Path B parts enabled
on:
  push:
    branches: [main]
    paths:
      - "be/**"
      - "3rd/edg"
      - "3rd/qbe"
      - "scripts/pathb-*"
      - "scripts/setup-pathb.sh"
      - "scripts/setup-edg.sh"
      - "scripts/setup-qbe.sh"
      - "scripts/host-sys.sh"
      - "scripts/pathb-cc"
      - "scripts/mrb"
      - "scripts/setup-mruby.sh"
      - "scripts/mruby-tool-config.rb"
      - "tests/pathb/**"
      - "tests/pathb-*/**"
      - "tests/wasm/**"
      - "tests/sycl/**"
      - "lib/sycl/**"
      - "scripts/sycl-build.sh"
      - "scripts/pathb-wgsl-emit.rb"
      - "scripts/pathb-spirv-emit.rb"
      - "scripts/spirv-emit"
      - "tools/pathb-spirv-emit/**"
      - "scripts/qbe-prep.rb"
      - "tests/mruby/**"
      - "tests/cases/**"
      - "tests/cpp-features/**"
      - "scripts/cpp-feature-*.rb"
      - "tests/ehshim/**"
      - "lib/ehshim/**"
      - "scripts/ehshim"
      - "tests/safeptr/**"
      - "lib/safeptr/**"
      - "scripts/safeptr-rt"
      - "nfcxx"
      - "tests/realworld/tinyxml2_main.cpp"
      - ".github/workflows/pathb.yml"
  pull_request:
    paths:
      - "be/**"
      - "3rd/edg"
      - "3rd/qbe"
      - "scripts/pathb-*"
      - "scripts/setup-pathb.sh"
      - "scripts/setup-edg.sh"
      - "scripts/setup-qbe.sh"
      - "scripts/host-sys.sh"
      - "scripts/pathb-cc"
      - "scripts/mrb"
      - "scripts/setup-mruby.sh"
      - "scripts/mruby-tool-config.rb"
      - "tests/pathb/**"
      - "tests/pathb-*/**"
      - "tests/wasm/**"
      - "tests/sycl/**"
      - "lib/sycl/**"
      - "scripts/sycl-build.sh"
      - "scripts/pathb-wgsl-emit.rb"
      - "scripts/pathb-spirv-emit.rb"
      - "scripts/spirv-emit"
      - "tools/pathb-spirv-emit/**"
      - "scripts/qbe-prep.rb"
      - "tests/mruby/**"
      - "tests/cases/**"
      - "tests/cpp-features/**"
      - "scripts/cpp-feature-*.rb"
      - "tests/ehshim/**"
      - "lib/ehshim/**"
      - "scripts/ehshim"
      - "tests/safeptr/**"
      - "lib/safeptr/**"
      - "scripts/safeptr-rt"
      - "nfcxx"
      - "tests/realworld/tinyxml2_main.cpp"
      - ".github/workflows/pathb.yml"
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the Path B harness and the mruby tool once and saves them to the Actions cache; the test matrix below
  # restores them. The EDG and QBE builds come from the shared toolchain cache (.github/actions/toolchain).
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      # ninja jobs for the Path B harness build (scripts/setup-pathb.sh); the runner has 4 cores and 16 GB, and
      # the harness links with -flto, so do not oversubscribe it.
      PATHB_JOBS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # python3 only for the oracles of tests/mruby/run.sh; ruby and rake only bootstrap the mruby build.
      - uses: ./.github/actions/toolchain
        with:
          packages: python3 ruby rake

      # The harness (build/pathb) depends on be/, on the script that assembles it and on the EDG revision. An
      # exact hit skips the build; on a miss sccache still serves the unchanged EDG compiles.
      - name: Path B harness cache key
        id: key
        run: echo "edg=$(git rev-parse HEAD:3rd/edg)" >> "$GITHUB_OUTPUT"

      - name: Restore the Path B harness
        id: harness
        uses: actions/cache@v6
        with:
          path: build/pathb
          key: pathb-${{ runner.os }}-${{ steps.key.outputs.edg }}-${{ hashFiles('be/**', 'scripts/setup-pathb.sh') }}

      - name: Build the Path B harness
        if: steps.harness.outputs.cache-hit != 'true'
        run: scripts/setup-pathb.sh

      - name: Restore the mruby tool
        id: mruby
        uses: actions/cache@v6
        with:
          path: build/mruby-tool
          key: mruby-${{ runner.os }}-${{ hashFiles('scripts/setup-mruby.sh', 'scripts/mruby-tool-config.rb', 'scripts/mrb') }}

      - name: Build the mruby interpreter (runs scripts/pathb-qbe-emit.rb)
        if: steps.mruby.outputs.cache-hit != 'true'
        run: scripts/setup-mruby.sh

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # One suite per job, all restoring the build job's caches. The slowest suite (tests/mruby/run.sh, about 9 minutes
  # in its Path B emitter check) sets the total time.
  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Path B stages 1-2 and wasm
            run: |
              tests/pathb/run.sh
              tests/pathb-ir/run.sh
              tests/pathb-borrow/run.sh
              tests/wasm/run.sh
          - name: Path B stage 3 (IR to QBE translation validation)
            run: tests/pathb-qbe/run.sh
          - name: Hosted Path B (NFCXX_PATH=b)
            run: tests/pathb-qbe/hosted.sh
          - name: C++11 and C++14 language feature probes (Path B)
            run: FEATURE_ROUTES=pathb FEATURE_REQUIRE_PASS=1 tests/cpp-features/run.sh
          - name: EH shim (gcc, qbe and Path B)
            run: tests/ehshim/run.sh
          - name: Safe pointers (-fsafe-pointers, with the sweep of the Path B probes)
            run: SAFEPTR_SWEEP=1 tests/safeptr/run.sh
          - name: SYCL on WebGPU and Vulkan (host path, Chromium's WebGPU through Playwright, lavapipe for Vulkan)
            run: |
              sudo apt-get install -y -q spirv-tools libvulkan-dev mesa-vulkan-drivers
              npm install --prefix "$RUNNER_TEMP/pw" playwright
              "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
              # every device compile runs both SPIR-V emitters (scripts/spirv-emit): the C++ port must match the Ruby
              NFCXX_SPIRV_EMITTER=check NFCXX_PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" tests/sycl/run.sh
          - name: C++ SPIR-V emitter against the Ruby (both modes, every SYCL test's device IR)
            run: tools/pathb-spirv-emit/check.sh
          - name: mruby scripts against their Python oracles (Path B parts enabled)
            run: tests/mruby/run.sh
          - name: mruby-ninja generic file tasks (rule is refused)
            run: tests/mruby-ninja/run.sh
    name: ${{ matrix.name }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ./.github/actions/toolchain
        with:
          packages: python3 ruby rake

      - name: Path B harness cache key
        id: key
        run: echo "edg=$(git rev-parse HEAD:3rd/edg)" >> "$GITHUB_OUTPUT"

      - name: Restore the Path B harness
        uses: actions/cache/restore@v6
        with:
          path: build/pathb
          key: pathb-${{ runner.os }}-${{ steps.key.outputs.edg }}-${{ hashFiles('be/**', 'scripts/setup-pathb.sh') }}
          fail-on-cache-miss: true

      - name: Restore the mruby tool
        uses: actions/cache/restore@v6
        with:
          path: build/mruby-tool
          key: mruby-${{ runner.os }}-${{ hashFiles('scripts/setup-mruby.sh', 'scripts/mruby-tool-config.rb', 'scripts/mrb') }}
          fail-on-cache-miss: true

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats
