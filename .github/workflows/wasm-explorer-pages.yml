name: wasm explorer (GitHub Pages)

# Builds the wasm explorer's static site (wasm-explorer-build.yml, which compiles and checks every example) on pushes
# and pull requests, and deploys it to GitHub Pages from main. The page on Pages cannot compile other code (it has no
# server); it shows the example builds. A pull request's preview on Cloudflare Pages is wasm-explorer-preview.yml,
# started by a /preview comment.
#
# One-time repository setting: Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "tools/wasm-explorer/**"
      - "be/**"
      - "3rd/edg"
      - "scripts/pathb-*"
      - "scripts/llvm-to-pathb.rb"
      - "scripts/setup-tinygo.sh"
      - "scripts/setup-pathb.sh"
      - "scripts/setup-edg.sh"
      - "scripts/host-sys.sh"
      - "scripts/mrb"
      - "scripts/setup-mruby.sh"
      - "scripts/mruby-tool-config.rb"
      - ".github/workflows/wasm-explorer-pages.yml"
      - ".github/workflows/wasm-explorer-build.yml"
  pull_request:
    paths:
      - "tools/wasm-explorer/**"
      - "be/**"
      - "3rd/edg"
      - "scripts/pathb-*"
      - "scripts/llvm-to-pathb.rb"
      - "scripts/setup-tinygo.sh"
      - "scripts/setup-pathb.sh"
      - "scripts/setup-edg.sh"
      - "scripts/host-sys.sh"
      - "scripts/mrb"
      - "scripts/setup-mruby.sh"
      - "scripts/mruby-tool-config.rb"
      - ".github/workflows/wasm-explorer-pages.yml"
      - ".github/workflows/wasm-explorer-build.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/wasm-explorer-build.yml

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

