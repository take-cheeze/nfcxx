name: Real-world

# The larger real-world builds of docs/notes/realworld.md: doctest (hosted C++, gcc backend), Lua 5.4 (C input mode
# and its own makefile through nfcc), mruby (its rake build with nfcc as the compiler, bootstrapped: the QBE-compiled
# parser and VM run during the build), TinyCC (its own makefile through nfcc, then its tests2 suite), optcarrot, and the CoreCLR GC's compile on both backends. Each one clones its pinned
# upstream commit into build/realworld. tinyxml2 stays
# in the main CI job. Run only when a change can affect the compilers they exercise. Runs on demand too.
on:
  push:
    branches: [main]
    paths:
      - "nfcxx"
      - "nfcc"
      - "3rd/edg"
      - "3rd/qbe"
      - "3rd/cproc"
      - "scripts/qbe-cc"
      - "scripts/qbe-prep.rb"
      - "scripts/weak-symbols.rb"
      - "scripts/mrb"
      - "scripts/setup-*.sh"
      - "scripts/cproc-*.patch"
      - "scripts/mruby-tool-config.rb"
      - "tests/realworld/**"
      - ".github/workflows/realworld.yml"
  pull_request:
    paths:
      - "nfcxx"
      - "nfcc"
      - "3rd/edg"
      - "3rd/qbe"
      - "3rd/cproc"
      - "scripts/qbe-cc"
      - "scripts/qbe-prep.rb"
      - "scripts/weak-symbols.rb"
      - "scripts/mrb"
      - "scripts/setup-*.sh"
      - "scripts/cproc-*.patch"
      - "scripts/mruby-tool-config.rb"
      - "tests/realworld/**"
      - ".github/workflows/realworld.yml"
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  realworld:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # ruby and rake: the mruby interpreter bootstrap (scripts/setup-mruby.sh) and run_mruby.sh's own rake build.
      # make: Lua's makefile (run_lua_make.sh).
      - uses: ./.github/actions/toolchain
        with:
          packages: make ruby rake

      - name: doctest (hosted C++, gcc backend; the qbe request is reported as a documented SKIP)
        run: tests/realworld/run_doctest.sh

      - name: Lua 5.4 as C inputs (both backends)
        run: tests/realworld/run_lua.sh

      - name: Lua 5.4 through its own makefile with nfcc (both backends)
        run: tests/realworld/run_lua_make.sh

      - name: mruby rake build with nfcc (both backends)
        run: tests/realworld/run_mruby.sh

      - name: TinyCC 0.9.27 built with its own makefile and nfcc, then its tests2 suite (both backends)
        run: tests/realworld/run_tinycc.sh

      - name: optcarrot benchmark on an nfcc-built mruby (both backends, checksum 59662)
        run: tests/realworld/run_optcarrot.sh

      - name: CoreCLR workstation GC, 34 translation units (both backends; docs/notes/coreclr-gc.md)
        run: tests/realworld/run_coreclr_gc.sh

      - name: sccache stats
        if: always()
        run: sccache --show-stats
