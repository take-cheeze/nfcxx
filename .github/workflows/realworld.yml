name: Real-world

# The larger real-world builds of docs/notes/realworld.md: doctest (hosted C++, gcc backend), Lua 5.4 (C input mode
# and its own makefile through nfcc), mruby (its rake build with nfcc as the compiler, bootstrapped: the QBE-compiled
# parser and VM run during the build), TinyCC (its own makefile through nfcc, then its tests2 suite), SDCC (its compiler built by nfcc, output compared), optcarrot, and the CoreCLR GC's compile on both backends. Each one clones its pinned
# upstream commit into build/realworld. tinyxml2 stays
# in the main CI job. Run only when a change can affect the compilers they exercise. Runs on demand too.
on:
  push:
    branches: [main]
    paths:
      - "nfcxx"
      - "nfcc"
      - "3rd/edg"
      - "3rd/qbe"
      - "3rd/cproc"
      - "scripts/qbe-cc"
      - "scripts/qbe-prep"
      - "tools/qbe-prep/**"
      - "scripts/weak-symbols"
      - "tools/weak-symbols/**"
      - "scripts/mrb"
      - "scripts/setup-*.sh"
      - "scripts/cproc-*.patch"
      - "scripts/mruby-tool-config.rb"
      - "tests/realworld/**"
      - ".github/workflows/realworld.yml"
  pull_request:
    paths:
      - "nfcxx"
      - "nfcc"
      - "3rd/edg"
      - "3rd/qbe"
      - "3rd/cproc"
      - "scripts/qbe-cc"
      - "scripts/qbe-prep"
      - "tools/qbe-prep/**"
      - "scripts/weak-symbols"
      - "tools/weak-symbols/**"
      - "scripts/mrb"
      - "scripts/setup-*.sh"
      - "scripts/cproc-*.patch"
      - "scripts/mruby-tool-config.rb"
      - "tests/realworld/**"
      - ".github/workflows/realworld.yml"
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Three shards run in parallel, each on its own runner with its own checkout, so the wall time is the slowest shard
# (SDCC alone, about 8 minutes) instead of the sum of all nine scripts (about 18). Shards share no build output: each
# script clones its own upstream into build/realworld, and optcarrot builds its own mruby.
jobs:
  realworld:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SDCC
            packages: make ruby rake bison flex libboost-graph-dev
            run: |
              tests/realworld/run_sdcc.sh

          - name: doctest, mruby, optcarrot
            packages: make ruby rake
            run: |
              tests/realworld/run_doctest.sh
              tests/realworld/run_mruby.sh
              tests/realworld/run_optcarrot.sh

          - name: Lua, TinyCC, CoreCLR GC, ASTro
            packages: make ruby rake libgmp-dev
            run: |
              tests/realworld/run_lua.sh
              tests/realworld/run_lua_make.sh
              tests/realworld/run_tinycc.sh
              tests/realworld/run_coreclr_gc.sh
              tests/realworld/run_astro.sh
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Per shard: ruby and rake (the mruby bootstrap and build, ASTroGen), make (Lua's and TinyCC's makefiles, SDCC),
      # bison, flex and libboost-graph-dev (SDCC's build), libgmp-dev (koruby_precise's real bignums; without it run_astro.sh
      # builds BIGNUM=wrap).
      - uses: ./.github/actions/toolchain
        with:
          packages: ${{ matrix.packages }}

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats
