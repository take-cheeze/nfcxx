name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The weekly run is the bc2cpp mrbc-snapshot job alone (see bc2cpp-changes and the schedule guards on the other jobs): the
  # fork's mrbc moves with the pinned world, so drift must show without a change here.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      self_aot:
        description: Build and verify the bc2cpp self-AOT compiler
        type: boolean
        default: false
      mrbc_rb:
        description: "BC2CPP_MRBC_RB for every bc2cpp world/checks job: snapshot, verify, or record (= verify plus BC2CPP_MRBC_SNAPSHOT_RECORD; the record files are uploaded as artifacts for snapshot.rb --update --from-record)"
        default: ""
      oracle_update:
        description: "bc2cpp mrbc-snapshot: regenerate snapshot_world.txt with the upstream mruby oracle and upload it as an artifact"
        type: boolean
        default: false

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The gcc backend (EDG's C compiled by gcc) is the slow, redundant half of most suites: Path B and qbe are the backends a change
# is judged on. Its runs happen on pushes to main only (GCC_BACKEND=1); a PR runs the same jobs without them, so every selected
# job still reports success to the build-and-test gate. Steps that run gcc test `env.GCC_BACKEND`; the entries of the test
# matrix that exist only for gcc (.github/ci-test-matrix.yml, gcc_only: true) are left out of the matrix by scripts/ci-scope.rb
# off main, so those legs never start (a whole job skipped would fail the gate; a matrix with fewer legs does not).
env:
  GCC_BACKEND: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}

jobs:
  # Builds the EDG front end and QBE once and saves them to the Actions cache (.github/actions/toolchain); the
  # test jobs below, the Path B jobs and the hexagon and realworld workflows, restore them instead of rebuilding.
  # build/ holds absolute paths, so every job uses the same checkout path.
  build:
    needs: pathb-changes
    if: github.event_name != 'schedule' && needs.pathb-changes.outputs.full_ci == 'true'
    runs-on: ubuntu-24.04
    env:
      # sccache stores compiler outputs in the GitHub Actions cache.
      SCCACHE_GHA_ENABLED: "true"
      # CMake reads these when configuring the EDG build (scripts/setup-edg.sh).
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ./.github/actions/toolchain
        with:
          packages: python3 python3-dev ruby rake clang

      # The upstream harness scripts and their offline self-test (tests/upstream): under a minute.
      - name: Syntax of the upstream scripts and Python
        run: |
          for f in tests/upstream/*.sh; do bash -n "$f"; done
          python3 -m py_compile tests/upstream/*.py

      - name: Native upstream harness self-test
        run: python3 tests/upstream/nightly-self-test.py

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  test:
    if: github.event_name != 'schedule'
    needs: [build, pathb-changes]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # The entries are .github/ci-test-matrix.yml, filtered by scripts/ci-scope.rb (gcc-only entries only on main).
      matrix:
        include: ${{ fromJSON(needs.pathb-changes.outputs.test_matrix) }}
    name: ${{ matrix.name }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ./.github/actions/toolchain
        with:
          packages: python3 python3-dev ruby rake clang

      # The interpreter of nfcpoly's Go backend (yaegi in a cgo library); without Go >= 1.24 tests/poly/run.sh skips Go.
      - name: Set up Go
        if: matrix.go
        uses: actions/setup-go@v7
        with:
          go-version-file: lib/poly/go/go.mod
          cache-dependency-path: lib/poly/go/go.sum

      # Build outputs that the test steps below would otherwise rebuild on every run. Each cache key holds what the output is
      # built from (the sources the build script and the compiler read, and the toolchain), so a hit is the output this commit
      # would build. The test programs are cached in the same way; they still run on every run.
      - name: Cache keys for the rebuilt outputs
        id: key
        run: |
          echo "toolchain=$(git rev-parse HEAD:3rd/edg)-$(git rev-parse HEAD:3rd/qbe)" >> "$GITHUB_OUTPUT"
          echo "host=$(gcc -dumpfullversion)-$(g++ -dumpfullversion)-ruby$(ruby -e 'print RUBY_VERSION')" >> "$GITHUB_OUTPUT"
          echo "go=$(go env GOVERSION 2>/dev/null)" >> "$GITHUB_OUTPUT"

      # scripts/mrb runs nfcxx's scripts with this mruby, and every QBE-backend compile runs it, so each QBE job built it on
      # first use. setup-mruby.sh only checks that the executable exists, so the key holds the script, its config and mrb.
      - name: Restore the mruby tool
        uses: actions/cache@v6
        with:
          path: build/mruby-tool/bin/mruby
          key: mruby-tool-${{ runner.os }}-${{ hashFiles('scripts/setup-mruby.sh', 'scripts/mruby-tool-config.rb', 'scripts/mrb') }}-${{ steps.key.outputs.host }}

      # The nfcpoly interpreters (scripts/setup-poly.sh, setup-poly-lua.sh, setup-poly-js.sh) for one back end. Their inputs are
      # the scripts, the patches and the pins in them, the compiler (nfcxx, nfcc, be/, the runtime files of lib/ that the
      # driver adds) and the toolchain.
      - name: Restore the nfcpoly interpreters
        if: matrix.interp
        uses: actions/cache@v6
        with:
          path: |
            build/poly/${{ matrix.backend }}
            build/poly-lua/${{ matrix.backend }}
            build/poly-js/${{ matrix.backend }}
          key: nfcpoly-interp-${{ runner.os }}-${{ matrix.backend }}-${{ hashFiles('scripts/**', 'tools/weak-symbols/**', 'nfcxx', 'nfcc', 'be/**', 'lib/cuda/**', 'lib/ehshim/**', 'lib/asan/**') }}-${{ steps.key.outputs.toolchain }}-${{ steps.key.outputs.host }}

      # The Go library (scripts/setup-poly-go.sh: yaegi in a cgo library, built by the host's Go and gcc, shared by both back ends).
      - name: Restore the nfcpoly Go library
        if: matrix.go
        uses: actions/cache@v6
        with:
          path: build/poly-go
          key: nfcpoly-go-${{ runner.os }}-${{ hashFiles('scripts/setup-poly-go.sh', 'lib/poly/go/**') }}-${{ steps.key.outputs.go }}-${{ steps.key.outputs.host }}

      # actions/cache restores files with the modification times they were saved with (GNU tar keeps them), which are older
      # than the checkout just made, and the setup scripts rebuild an output that is not newer than its inputs. The key already
      # says the restored output is built from these inputs, so the restored files are touched to say so.
      - name: Mark the restored outputs as up to date
        run: |
          for d in build/poly/*/ build/poly-lua/*/ build/poly-js/*/ build/poly-go/; do
            if [ -d "$d" ]; then find "$d" -type f -exec touch {} +; fi
          done

      # tests/uop/run.sh differentiates with onnxsim and checks models with onnx and onnxruntime (docs/notes/uop-autodiff.md); without
      # them those tests print SKIP. The C++ library is the primary way (scripts/setup-onnxsim.sh builds onnxsim 0.8.1's sources, pinned
      # by hash, in about 2 minutes; the cache key holds the script and the shim); the pip packages also serve the Python fallback.
      - name: Python test dependencies (onnx, onnxruntime, numpy, onnxsim)
        if: matrix.onnx
        run: |
          sudo apt-get install -y --no-install-recommends python3-pip protobuf-compiler libprotobuf-dev
          python3 -m pip install --break-system-packages onnx onnxruntime numpy onnxsim==0.8.1

      - name: Restore libnfconnxsim.so
        id: onnxsim
        if: matrix.onnx
        uses: actions/cache@v6
        with:
          path: |
            build/onnxsim/libnfconnxsim.so
            build/onnxsim/built-*
          key: onnxsim-${{ runner.os }}-${{ hashFiles('scripts/setup-onnxsim.sh', 'scripts/onnxsim/**') }}

      - name: Build libnfconnxsim.so
        if: matrix.onnx && steps.onnxsim.outputs.cache-hit != 'true'
        run: scripts/setup-onnxsim.sh

      # The nfcpoly and nfcuop test programs. tests/poly/run.sh and tests/uop/run.sh keep each program they compile in
      # TEST_BIN_CACHE, named by a hash of its command line, and run it on every run. The key holds the sources those
      # programs include (poly: lib/poly and lib/ast; uop: lib/uop and lib/poly; the suite's tests), the runtime files the
      # driver links (lib/ehshim, lib/asan, lib/cuda), the scripts and the compiler, the back end and the toolchain.
      - name: Restore the test programs
        if: matrix.suite
        uses: actions/cache@v6
        with:
          path: build/test-bin
          key: test-bin-${{ matrix.group || matrix.suite }}-${{ runner.os }}-${{ matrix.backend }}-${{ matrix.suite == 'poly' && hashFiles('lib/poly/**', 'lib/ast/**', 'tests/poly/**', 'scripts/**', 'tools/weak-symbols/**', ''nfcxx', 'nfcc', 'be/**', 'lib/ehshim/**', 'lib/asan/**', 'lib/cuda/**') || hashFiles('lib/uop/**', 'lib/poly/**', 'tests/uop/**', 'scripts/**', 'tools/weak-symbols/**', 'tools/qbe-prep/**', 'nfcxx', 'nfcc', 'be/**', 'lib/ehshim/**', 'lib/asan/**', 'lib/cuda/**') }}-${{ steps.key.outputs.toolchain }}-${{ steps.key.outputs.host }}-${{ steps.key.outputs.go }}

      # The Path B harness (scripts/setup-pathb.sh), keyed as the pathb-build job keys it: its inputs are be/ and the script, and the EDG revision.
      - name: Path B harness cache key
        if: matrix.pathb
        id: pathb-key
        run: echo "edg=$(git rev-parse HEAD:3rd/edg)" >> "$GITHUB_OUTPUT"

      - name: Restore the Path B harness
        if: matrix.pathb
        id: harness
        uses: actions/cache@v6
        with:
          path: build/pathb
          key: pathb-${{ runner.os }}-${{ steps.pathb-key.outputs.edg }}-${{ hashFiles('be/**', 'scripts/setup-pathb.sh') }}

      - name: Build the Path B harness
        if: matrix.pathb && steps.harness.outputs.cache-hit != 'true'
        run: scripts/setup-pathb.sh

      - name: .NET 8 SDK (the CIL backend's test programs run with dotnet)
        if: matrix.dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: ${{ matrix.name }}
        env:
          TEST_BIN_CACHE: ${{ matrix.suite && 'build/test-bin' || '' }}
        run: ${{ matrix.run }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # Linux arm64 (moved here from arm.yml so that build-and-test can depend on them; check names unchanged).
  arm-build:
    needs: pathb-changes
    if: github.event_name != 'schedule' && needs.pathb-changes.outputs.full_ci == 'true'
    name: arm build
    runs-on: ubuntu-24.04-arm
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ./.github/actions/toolchain
        with:
          packages: python3 python3-dev ruby rake clang

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  arm-test:
    if: github.event_name != 'schedule'
    needs: arm-build
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cases (QBE and gcc backends)
            run: |
              # Path B: the default driver is Path B on every host (docs/notes/pathb-default.md). The name is kept
              # so a required check of this name does not disappear.
              NFCXX_BACKEND=pathb tests/run.sh
              if [ "$GCC_BACKEND" = 1 ]; then NFCXX_BACKEND=gcc tests/run.sh; fi
          # float-to-int checks the x87 helpers of be/nfcxx_ldrt.c, which exist only on x86-64, so it stays off this runner.
          - name: freestanding lib, builtins, trace, C inputs, cc mode, driver options, determinism
            run: |
              tests/lib/run.sh
              tests/target/run.sh
              tests/builtins/run.sh
              tests/trace/run.sh
              tests/c/run.sh
              tests/c/cc-mode.sh
              tests/cxx-driver/run.sh
              tests/determinism/run.sh
    name: arm64 ${{ matrix.name }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ./.github/actions/toolchain
        with:
          packages: python3 python3-dev ruby rake clang

      # The Path B harness (scripts/setup-pathb.sh): the cases run NFCXX_BACKEND=pathb, and the driver needs the harness.
      # Keyed as the other Path B jobs key it.
      - name: Path B harness cache key
        id: pathb-key
        run: echo "edg=$(git rev-parse HEAD:3rd/edg)" >> "$GITHUB_OUTPUT"

      - name: Restore the Path B harness
        id: harness
        uses: actions/cache@v6
        with:
          path: build/pathb
          # runner.arch too: the x86-64 jobs cache the same path under the same runner.os, and an x86-64 cpfe does not run here
          key: pathb-${{ runner.os }}-${{ runner.arch }}-${{ steps.pathb-key.outputs.edg }}-${{ hashFiles('be/**', 'scripts/setup-pathb.sh') }}

      - name: Build the Path B harness
        if: steps.harness.outputs.cache-hit != 'true'
        run: scripts/setup-pathb.sh

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # macOS arm64, one job per back end (moved here from macos.yml; check names unchanged).
  macos-suites:
    needs: pathb-changes
    if: github.event_name != 'schedule' && needs.pathb-changes.outputs.full_ci == 'true'
    name: macOS arm64 (${{ matrix.backend }} backend)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # gcc on pushes to main only (GCC_BACKEND, top of the file)
        backend: ${{ fromJSON(github.ref == 'refs/heads/main' && '["gcc","pathb"]' || '["pathb"]') }}
    env:
      NFCXX_BACKEND: ${{ matrix.backend }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Tools
        run: brew install ccache ninja cmake

      - name: Ruby and rake (mruby's bootstrap)
        run: |
          ruby --version
          rake --version || gem install rake
          rake --version

      - name: ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-macos-arm64-${{ hashFiles('scripts/setup-edg.sh', 'scripts/setup-qbe.sh', 'scripts/*.patch') }}-${{ github.run_id }}
          restore-keys: ccache-macos-arm64-

      - name: EDG front end
        run: scripts/setup-edg.sh

      - name: Path B harness
        if: matrix.backend == 'pathb'
        run: scripts/setup-pathb.sh

      # The freestanding suites (tests/lib, tests/target) still use qbe on macOS: Path B takes freestanding programs on
      # x86-64 and aarch64 Linux only (docs/notes/freestanding.md).
      - name: QBE
        run: scripts/setup-qbe.sh

      - name: Test suites
        run: |
          tests/run.sh
          tests/builtins/run.sh
          tests/trace/run.sh
          tests/c/run.sh
          tests/c/cc-mode.sh
          # tests/cxx-driver is gcc's by design: its header records that Path B fails 16 of its 52 checks, so the pathb leg runs it on gcc
          NFCXX_BACKEND=gcc tests/cxx-driver/run.sh
          if [ "$NFCXX_BACKEND" = pathb ]; then
            tests/lib/run.sh
            tests/target/run.sh
          else
            tests/lib/run.sh
            tests/target/run.sh
          fi

      - name: ccache stats
        if: always()
        run: ccache -s || true


  # Path B (docs/notes/pathb-stage1.md to pathb-stage3.md). Building the harness compiles the whole EDG front end a second
  # time, so these jobs run only when a change can affect them (the list below), and on demand (workflow_dispatch). A build
  # job makes the harness and the mruby tool, and the suites run in parallel from their caches. ruby and rake only
  # bootstrap the mruby build.
  #   tests/pathb/run.sh       stage 1 IL goldens (tests/pathb/*.il)
  #   tests/pathb-ir/run.sh    stage 2 IR goldens (tests/pathb-ir/*.ir) and node coverage
  #   tests/pathb-qbe/run.sh   stage 3 translation validation: IR -> QBE -> run, against EXPECT and the gcc backend
  #   (tests/pathb-egraph/run.sh, the e-graph pass, is a matrix entry of the test job above)
  #   tests/wasm/run.sh        the wasm emitter (scripts/pathb-wasm-emit.rb): IR -> wasm, run under node, against EXPECT
  #   tests/pathb-qbe/hosted.sh  hosted Path B (NFCXX_PATH=b driver, hosted probes, tinyxml2)
  #   tests/ehshim/run.sh      the EH shim (lib/ehshim): libstdc++ exceptions and exception_ptr on gcc, qbe and Path B
  #   tests/safeptr/run.sh     -fsafe-pointers (lib/safeptr, docs/notes/safe-pointers.md), and the Path B probes under it
  pathb-changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
      full_ci: ${{ steps.paths.outputs.full_ci }}
      test_matrix: ${{ steps.paths.outputs.test_matrix }}
    steps:
      # fetch-depth 0: the change check diffs against the base commit, which a shallow clone does not have.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # Only isolated bc2cpp/test/docs PRs omit the general compiler matrix.
      # Main pushes and manual runs retain full coverage; failed selection blocks the gate.
      - name: Check CI routing policy
        run: ruby tests/ci/scope_check.rb

      - name: Select CI coverage
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ruby scripts/ci-scope.rb

  pathb-build:
    needs: pathb-changes
    if: github.event_name != 'schedule' && needs.pathb-changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      # ninja jobs for the Path B harness build (scripts/setup-pathb.sh); the runner has 4 cores and 16 GB, and
      # the harness links with -flto, so do not oversubscribe it.
      PATHB_JOBS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ./.github/actions/toolchain
        with:
          packages: python3 ruby rake

      # The harness (build/pathb) depends on be/, on the script that assembles it and on the EDG revision. An
      # exact hit skips the build; on a miss sccache still serves the unchanged EDG compiles.
      - name: Path B harness cache key
        id: key
        run: echo "edg=$(git rev-parse HEAD:3rd/edg)" >> "$GITHUB_OUTPUT"

      - name: Restore the Path B harness
        id: harness
        uses: actions/cache@v6
        with:
          path: build/pathb
          key: pathb-${{ runner.os }}-${{ steps.key.outputs.edg }}-${{ hashFiles('be/**', 'scripts/setup-pathb.sh') }}

      - name: Build the Path B harness
        if: steps.harness.outputs.cache-hit != 'true'
        run: scripts/setup-pathb.sh

      - name: Restore the mruby tool
        id: mruby
        uses: actions/cache@v6
        with:
          path: build/mruby-tool
          key: mruby-${{ runner.os }}-${{ hashFiles('scripts/setup-mruby.sh', 'scripts/mruby-tool-config.rb', 'scripts/mrb') }}

      - name: Build the mruby interpreter (runs scripts/pathb-qbe-emit.rb)
        if: steps.mruby.outputs.cache-hit != 'true'
        run: scripts/setup-mruby.sh

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # One suite per job, all restoring the pathb-build job's caches. The slowest suite sets the total time.
  pathb-test:
    if: github.event_name != 'schedule'
    # Skipped with pathb-build when the change does not touch Path B.
    needs: pathb-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Path B stages 1-2, wasm and the mruby-ninja file tasks
            run: |
              tests/pathb/run.sh
              tests/pathb-ir/run.sh
              tests/pathb-borrow/run.sh
              tests/wasm/run.sh
              NFCXX_WASM_OPT=1 tests/wasm/run.sh
              tests/mruby-ninja/run.sh
          - name: Path B stage 3 (IR to QBE translation validation) and hosted Path B (NFCXX_PATH=b)
            run: |
              tests/pathb-qbe/run.sh
              tests/pathb-qbe/hosted.sh
              tests/pathb-qbe/static_linkage.sh
          - name: C++11 and C++14 probes (Path B) and the EH shim (gcc, qbe and Path B)
            run: |
              FEATURE_ROUTES=pathb FEATURE_REQUIRE_PASS=1 tests/cpp-features/run.sh
              tests/ehshim/run.sh
              NFCXX_BACKEND=pathb tests/lib/run.sh
          - name: Safe pointers (-fsafe-pointers, with the sweep of the Path B probes)
            run: SAFEPTR_SWEEP=1 tests/safeptr/run.sh
          # Explicit --backend=pathb: the SSA emitter's __asan_load/store checks (docs/notes/asan.md, "Path B"). The default
          # backend with -fsanitize=address is Path B too (and --backend=gcc with it is refused).
          - name: AddressSanitizer on Path B (heap checks; tests/asan/pathb-pending.txt lists the later milestones)
            run: ASAN_BACKEND=pathb tests/asan/run.sh
          - name: SYCL on WebGPU and Vulkan (host path, Chromium's WebGPU through Playwright, lavapipe for Vulkan)
            run: |
              sudo apt-get install -y -q spirv-tools libvulkan-dev mesa-vulkan-drivers
              npm install --prefix "$RUNNER_TEMP/pw" playwright
              "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
              NFCXX_PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" tests/sycl/run.sh
    name: ${{ matrix.name }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ./.github/actions/toolchain
        with:
          packages: python3 ruby rake

      - name: Path B harness cache key
        id: key
        run: echo "edg=$(git rev-parse HEAD:3rd/edg)" >> "$GITHUB_OUTPUT"

      - name: Restore the Path B harness
        uses: actions/cache/restore@v6
        with:
          path: build/pathb
          key: pathb-${{ runner.os }}-${{ steps.key.outputs.edg }}-${{ hashFiles('be/**', 'scripts/setup-pathb.sh') }}
          fail-on-cache-miss: true

      - name: Restore the mruby tool
        uses: actions/cache/restore@v6
        with:
          path: build/mruby-tool
          key: mruby-${{ runner.os }}-${{ hashFiles('scripts/setup-mruby.sh', 'scripts/mruby-tool-config.rb', 'scripts/mrb') }}
          fail-on-cache-miss: true

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # Keep the required build-and-test check on every PR. Only an explicit successful
  # selection can authorize skipped suites; every selected suite must succeed.
  # if: always() also validates failed/cancelled selectors and dependencies.
  # The generated matrix of the test job (needs.pathb-changes.outputs.test_matrix, part of NEEDS_JSON) is checked here too:
  # each leg it names must have run in this run and succeeded (the result of the test job alone would pass a matrix that had
  # lost a leg). The run's jobs are listed first for that (JOBS_FILE); a run whose list is missing does not pass.
  build-and-test:
    if: always() && github.event_name != 'schedule'
    needs: [build, test, arm-build, arm-test, macos-suites, pathb-changes, pathb-build, pathb-test,
      bc2cpp-changes, world, mrbc-rb, mrbc-snapshot, checks, nfcxx-clang-parity]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # filter=latest: a re-run's jobs, not the attempts before it. gh prints one {name, conclusion} per job, page after page.
      - name: List the jobs of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | {name, conclusion}' | jq -s . > "$RUNNER_TEMP/jobs.json"

      - name: Require every selected build and test job, and every leg of the test matrix, to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          JOBS_FILE: ${{ runner.temp }}/jobs.json
        run: ruby scripts/ci-scope.rb --gate

  # Probe: how far Path B gets on macOS arm64 (PRs 877 and 883). Not gating: build-and-test does not need it. Each step
  # runs on its own (if: always()), so the first failure does not hide the next. The default driver run records whether
  # Path B built the hello program or the gcc fallback did.
  macos-pathb-probe:
    name: macOS arm64 Path B probe
    # Runs only when the Path B selection (pathb-changes) sees a Path B path change. Not in build-and-test's needs: non-gating.
    needs: pathb-changes
    if: github.event_name != 'schedule' && needs.pathb-changes.outputs.changed == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Tools
        run: brew install ninja cmake

      - name: EDG front end
        run: scripts/setup-edg.sh

      - name: QBE
        if: always()
        run: scripts/setup-qbe.sh

      - name: Path B harness
        if: always()
        run: scripts/setup-pathb.sh

      - name: Hosted Path B hello (NFCXX_PATH=b)
        if: always()
        run: |
          printf '#include <cstdio>\nint main(){std::printf("pathb macos ok\\n");return 0;}\n' > hello.cpp
          NFCXX_PATH=b ./nfcxx hello.cpp -o hello && ./hello

      - name: Default driver hello (Path B, else gcc fallback)
        if: always()
        run: |
          printf '#include <cstdio>\nint main(){std::printf("default ok\\n");return 0;}\n' > hello_default.cpp
          ./nfcxx hello_default.cpp -o hello_default && ./hello_default

      - name: Path B probes (tests/pathb-qbe/run.sh subset)
        if: always()
        # floats passes on macOS. gaps_float and gaps_sort need libc++'s type-trait builtins (__is_reference, ...), which
        # EDG does not provide yet: add them back when that lands.
        run: PATHB_QBE_ONLY='cases/floats' tests/pathb-qbe/run.sh --trace off

  # The bc2cpp jobs below run when a path they build from changes, as the bc2cpp workflow's own path filter did, and on a manual
  # run; the weekly run is mrbc-snapshot alone. `changed` is true on the schedule and dispatch events, and on a push or pull
  # request that touches a path in the filter.
  bc2cpp-changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.paths.outputs.bc2cpp == 'true' }}
    steps:
      # dorny/paths-filter diffs against the checked-out repository; without this step its git calls fail outside a checkout.
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: paths
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            bc2cpp:
            - "bc2cpp/**"
            - "tests/bc2cpp/**"
            - "scripts/pathb-qbe-emit.rb"
            # The other Ruby scripts a world compiles (tests/bc2cpp/worlds.list): a change to one is a change to its world. Without
            # these a change that the interpreter takes and the compiled build does not (a backtick, ENV, a regexp) reached main
            # unchecked. tests/ci/scope_check.rb keeps this list in step with the run_*.sh scripts.
            - "scripts/pathb-ssa.rb"
            - "scripts/pathb-egraph.rb"
            - "scripts/pathb-ssa-qbe.rb"
            - "scripts/pathb-ir-opt.rb"
            - "scripts/pathb-structure.rb"
            - "scripts/pathb-ssa-structurize.rb"
            - "scripts/pathb-cil-emit.rb"
            - "scripts/cil-link.rb"
            - "scripts/pathb-wgsl-emit.rb"
            - "scripts/pathb-spirv-emit.rb"
            - "scripts/pathb-spirv-kernel-emit.rb"
            - "scripts/pathb-wasm-emit.rb"
            - "scripts/llvm-to-pathb.rb"
            - "scripts/sycl-rewrite.rb"
            - "scripts/cpp-feature-checklist.rb"
            - "scripts/cpp-feature-report.rb"
            - "scripts/bc2cpp"
            - "scripts/setup-bc2cpp.sh"
            - "scripts/bc2cpp-self"
            - "scripts/setup-bc2cpp-self.sh"
            - "Gemfile"
            - "Gemfile.lock"
            - "scripts/pathb-borrowck.rb"
            - "tests/pathb-borrow/**"
            - "be/nfcxx_*.c"
            - "scripts/nfcxx-*"
            - "scripts/setup-libclang-edg.sh"
            - "scripts/build-libclang-edg.sh"
            - "scripts/setup-edg.sh"
            # The submodules and scripts the nfcxx-clang-parity job builds from (the toolchain action's cache keys): a bump
            # of EDG or QBE, or a change to their setup, must re-run the parity check.
            - "3rd/edg"
            - "3rd/qbe"
            - "scripts/setup-qbe.sh"
            - "scripts/qbe-*.patch"
            - "scripts/pathb-ldrt"
            - "be/nfcxx_*.h"
            - ".github/actions/toolchain/**"
            - ".github/workflows/ci.yml"

  # bc2cpp (bc2cpp/, the mruby-to-C++ compiler moved from rpg-maker-clone, docs/notes/bc2cpp-migration.md) compiling the worlds
  # under tests/bc2cpp/ (one tests/bc2cpp/run_<world>.sh per world: optcarrot, then nfcxx's own Ruby scripts, one world each,
  # listed in tests/bc2cpp/worlds.list and run three to a job) against a pinned rpg-maker-clone checkout (tests/bc2cpp/fetch.sh).
  # It needs only the host compiler and Ruby 4.0, not the EDG toolchain. They are in build-and-test's needs, so they gate
  # whenever bc2cpp-changes reports a change (scripts/ci-scope.rb, BC2CPP_JOBS): a run that skipped them is refused.
  # The worlds (tests/bc2cpp/worlds.list), three shards: a shard runs its worlds one after another in this job
  # (tests/bc2cpp/run_worlds.rb balances them by the list's weights, runs every world even after one fails, and prints a
  # per-world summary), so the checkout, Ruby, the build tools and the fetched world are paid for once per shard, not once per
  # world. A new world goes in worlds.list; raise the shard count here and in --shard when the shards outgrow the timeout.
  world:
    needs: bc2cpp-changes
    if: github.event_name != 'schedule' && needs.bc2cpp-changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      # No submodules: the worlds build from the pinned rpg-maker-clone checkout, not from 3rd/.
      - uses: actions/checkout@v7

      # Ruby 4.0 ships the Prism 1.x and RBS 4.x that bc2cpp is written against; the runner image's Ruby is older.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      # bison and gperf for the fork's mruby build, autoconf and automake for Onigmo (mruby-onig-regexp), gdb for a
      # crash's backtrace (tests/bc2cpp/run_optcarrot.sh).
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bison gperf autoconf automake libtool gdb

      # The pinned world (tests/bc2cpp/fetch.sh) is the same for every job and shard that fetches it, and fetch.sh
      # reuses a checkout at the same pin. The cache is keyed on fetch.sh, which holds the pin and the submodule list.
      - name: Restore the pinned world
        uses: actions/cache@v6
        with:
          path: build/bc2cpp/rpg-maker-clone
          key: bc2cpp-world-${{ runner.os }}-default-${{ hashFiles('tests/bc2cpp/fetch.sh') }}

      # -O2: the runner's Ubuntu g++ 13.3 miscompiles the -O3 build (SIGILL inside a call to bc2cpp_hint_violation that
      # is never entered); Debian's 13.5 and -O2 both pass.
      - name: bc2cpp worlds, shard ${{ matrix.shard }} of 3
        env:
          OPTCARROT_COMPILED_FLAGS: -O2
          # The Ruby emitter is the default compiler. Every world runs verify (it also runs the fork's mrbc and fails on any
          # byte difference) unless worlds.list names another mode or a dispatch's mrbc_rb input replaces it (snapshot compares
          # with what that mrbc once wrote, bc2cpp/tools/mrbc_rb/snapshot*.txt, and aborts on an input that is not in the table:
          # dispatch with mrbc_rb=record, then snapshot.rb --update --from-record on the artifact).
          BC2CPP_MRBC_RB_OVERRIDE: ${{ inputs.mrbc_rb }}
          BC2CPP_MRBC_RECORD_DIR: ${{ runner.temp }}
        run: ruby tests/bc2cpp/run_worlds.rb --shard ${{ matrix.shard }}/3

      - name: Upload the snapshot records
        if: always() && inputs.mrbc_rb == 'record'
        uses: actions/upload-artifact@v4
        with:
          name: mrbc-record-worlds-${{ matrix.shard }}
          path: ${{ runner.temp }}/mrbc-record-*.txt
          if-no-files-found: ignore

  # mrbc_rb (bc2cpp/tools/mrbc_rb): the Ruby RITE emitter, compared byte for byte with the fork's mrbc -g built from the
  # pinned world, then the command line (bin/mrbc_rb: all output formats, on every gem's mrblib set and every bc2cpp
  # source, and the `-v` listing; ~3 min together, so run in full rather than sampled) and bc2cpp's loader through it. tests/bc2cpp/run_mrbc_rb.sh runs
  # the tests against one oracle build. Uses the root Gemfile's Prism 1.9.0 under Ruby 4.0.
  mrbc-rb:
    needs: bc2cpp-changes
    if: github.event_name != 'schedule' && needs.bc2cpp-changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bison gperf autoconf automake libtool

      - name: Baked runner source graph
        run: bundle exec ruby tests/bc2cpp/source_baking.rb

      - name: Self compilation artifacts and registration
        run: bundle exec ruby tests/bc2cpp/self_compile.rb

      - name: Golden, CLI and integration tests against the fork's mrbc
        run: tests/bc2cpp/run_mrbc_rb.sh

  # mrbc-snapshot: the oracle-free verification. bc2cpp/tools/mrbc_rb/snapshot.txt (and snapshot_world.txt for the inputs of the pinned
  # world; the world commit in its header is informational, a pin bump alone does not fail: keys are content hashes) records, per input (content hash of the file
  # set), the hash of what the fork's mrbc -g wrote. This job is the one that has the oracle: it builds it once at the pinned
  # world, checks that every input the tests and the pinned world enumerate is in the table and still gives the recorded value
  # (drift of the fork or an incomplete table fails), then runs the emitter tests with NO mrbc, against the table. Jobs that
  # do not need to build mrbc can use BC2CPP_MRBC_RB=snapshot instead of verify. Scheduled too: the fork's mrbc moves with the
  # pinned world (tests/bc2cpp/fetch.sh), and a stale table must show up without anyone touching bc2cpp.
  mrbc-snapshot:
    needs: bc2cpp-changes
    if: needs.bc2cpp-changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bison gperf autoconf automake libtool

      - name: Build the oracle once and check the snapshot against it
        run: |
          set -eu
          root=$PWD
          . tests/bc2cpp/fetch.sh
          bc2cpp_fetch
          (cd "$bc2cpp_root/3rd/mruby" && env -u LD BUNDLE_GEMFILE="$root/Gemfile" bundle exec rake -j"$(nproc)") > build/bc2cpp/snapshot-oracle.log 2>&1 ||
            { tail -20 build/bc2cpp/snapshot-oracle.log; exit 1; }
          echo "BC2CPP_RPG_DIR=$bc2cpp_root" >> "$GITHUB_ENV"
          echo "ORACLE=$bc2cpp_root/3rd/mruby/bin/mrbc" >> "$GITHUB_ENV"
          if [ "${{ inputs.oracle_update }}" = true ]; then
            MRBC="$bc2cpp_root/3rd/mruby/bin/mrbc" BC2CPP_RPG_DIR="$bc2cpp_root" bundle exec ruby bc2cpp/tools/mrbc_rb/snapshot.rb --update
          else
            MRBC="$bc2cpp_root/3rd/mruby/bin/mrbc" BC2CPP_RPG_DIR="$bc2cpp_root" bundle exec ruby bc2cpp/tools/mrbc_rb/snapshot.rb --check
          fi

      # The regenerated table goes back to the branch it was built from, so the check on that branch can verify it.
      # A push with GITHUB_TOKEN does not start another workflow run.
      - name: Commit the regenerated snapshot to this branch
        if: inputs.oracle_update == true && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bc2cpp/tools/mrbc_rb/snapshot_world.txt
          if ! git diff --cached --quiet; then
            git commit -m "mrbc: regenerate snapshot_world.txt with the fork oracle"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload the regenerated snapshot
        if: inputs.oracle_update == true
        uses: actions/upload-artifact@v4
        with:
          name: snapshot_world
          path: bc2cpp/tools/mrbc_rb/snapshot_world.txt

      - name: Golden and CLI tests against the snapshot (no mrbc in the environment)
        run: |
          unset MRBC
          export BC2CPP_NO_MRBC=1
          bundle exec ruby bc2cpp/tools/mrbc_rb/golden_test.rb
          # cli_test starts bin/mrbc_rb once per input (about 0.2 s each): every 10th input keeps the step to a few minutes.
          MRBC_RB_CLI_SAMPLE=10 bundle exec ruby bc2cpp/tools/mrbc_rb/cli_test.rb
          bundle exec ruby bc2cpp/tools/mrbc_rb/snapshot.rb --verify
          bundle exec ruby bc2cpp/tools/mrbc_rb/snapshot_test.rb

  # bc2cpp's fixture checks (bc2cpp/scripts/bc2cpp/checks.list), three shards, moved from rpg-maker-clone's
  # bc2cpp-checks job. They run inside the pinned world (tests/bc2cpp/fetch.sh), whose bc2cpp paths reach this checkout
  # through its 3rd/nfcxx, with the world's own Nix dev shell, so the commands and their toolchain are unchanged.
  checks:
    needs: bc2cpp-changes
    if: github.event_name != 'schedule' && needs.bc2cpp-changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      RUBY_YJIT_ENABLE: "1"
      BC2CPP_WORLD_FULL: "1"
      # The Ruby emitter is the default compiler; verify also runs the fork's mrbc and fails on any byte difference. Stays on verify:
      # the fixtures compile generated programs (measured on 24 checks: 64 distinct inputs, none in the snapshot table). A dispatch with
      # mrbc_rb=record also writes the inputs of each check to a record file (uploaded below) for snapshot.rb --update --from-record.
      BC2CPP_MRBC_RB: ${{ (inputs.mrbc_rb == 'record' && 'verify') || inputs.mrbc_rb || 'verify' }}
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7

      # The runner context is not available in a job-level env, so the record path is exported from a step.
      - name: Snapshot record path
        if: inputs.mrbc_rb == 'record'
        run: echo "BC2CPP_MRBC_SNAPSHOT_RECORD=$RUNNER_TEMP/mrbc-record-checks-${{ matrix.shard }}.txt" >> "$GITHUB_ENV"

      # The pinned world (tests/bc2cpp/fetch.sh) is the same for every job and shard that fetches it, and fetch.sh
      # reuses a checkout at the same pin. The cache is keyed on fetch.sh, which holds the pin and the submodule list.
      - name: Restore the pinned world
        uses: actions/cache@v6
        with:
          path: build/bc2cpp/rpg-maker-clone
          key: bc2cpp-world-${{ runner.os }}-full-${{ hashFiles('tests/bc2cpp/fetch.sh') }}

      - name: World checkout
        run: tests/bc2cpp/world.sh

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-bc2cpp-${{ runner.os }}-${{ hashFiles('build/bc2cpp/rpg-maker-clone/flake.*') }}
          restore-prefixes-first-match: nix-bc2cpp-${{ runner.os }}-

      - name: Set up development environment
        working-directory: build/bc2cpp/rpg-maker-clone
        run: ./scripts/nix/develop-export-env.bash .#bc2cpp

      - name: Verify host Ruby JIT
        run: ruby -e 'abort "YJIT is unavailable or disabled" unless RubyVM::YJIT.enabled?; puts RUBY_DESCRIPTION'

      # Keyed on content digests, so a stale restore is recomputed rather than trusted.
      - name: Cache bc2cpp scan cache
        uses: actions/cache@v6
        with:
          path: build/bc2cpp/rpg-maker-clone/build/bc2cpp-cache
          key: bc2cpp-scan-cache-${{ hashFiles('bc2cpp/tools/bc2cpp/*.rb') }}
          restore-keys: bc2cpp-scan-cache-

      - name: Key for the fixture libmruby caches
        id: lib-key
        working-directory: build/bc2cpp/rpg-maker-clone
        run: |
          echo "mruby=$(git rev-parse HEAD:3rd/mruby)" >> "$GITHUB_OUTPUT"
          echo "stringio=$(git rev-parse HEAD:3rd/mruby-stringio)" >> "$GITHUB_OUTPUT"
      - name: Cache the full-core libmruby build
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bc2cpp-full
          key: bc2cpp-full-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/bc2cpp/rpg-maker-clone/flake.*') }}-${{ steps.lib-key.outputs.mruby }}-${{ steps.lib-key.outputs.stringio }}-${{ hashFiles('bc2cpp/scripts/bc2cpp/fixture_runtime.rb', 'build/bc2cpp/rpg-maker-clone/scripts/mruby/**', 'bc2cpp/scripts/bc2cpp/*.bash', 'build/bc2cpp/rpg-maker-clone/patches/mruby*.patch') }}
      # The same libmruby without mruby-fiber, for native_fiber_check (the C++ Fiber as the only Fiber).
      - name: Cache the no-fiber libmruby build
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bc2cpp-nofiber
          key: bc2cpp-nofiber-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/bc2cpp/rpg-maker-clone/flake.*') }}-${{ steps.lib-key.outputs.mruby }}-${{ hashFiles('bc2cpp/scripts/bc2cpp/fixture_runtime.rb', 'build/bc2cpp/rpg-maker-clone/scripts/mruby/**', 'build/bc2cpp/rpg-maker-clone/mruby-fiber-placeholder/**', 'bc2cpp/scripts/bc2cpp/*.bash', 'build/bc2cpp/rpg-maker-clone/patches/mruby*.patch') }}

      - name: Prepare shared check libraries
        working-directory: build/bc2cpp/rpg-maker-clone
        run: |
          env -u LD BC2CPP_FULL_BUILD_DIR="$RUNNER_TEMP/bc2cpp-full" ruby -r ./scripts/bc2cpp/fixture_runtime -e 'abort "full-core mruby unavailable" unless Bc2cppFixtureRuntime.full_or_build'
          env -u LD BC2CPP_NOFIBER_BUILD_DIR="$RUNNER_TEMP/bc2cpp-nofiber" ruby -r ./scripts/bc2cpp/fixture_runtime -e 'abort "no-fiber mruby unavailable" unless Bc2cppFixtureRuntime.nofiber_or_build'
          echo "MRBC=$RUNNER_TEMP/bc2cpp-full/host/bin/mrbc" >> "$GITHUB_ENV"
          echo "BC2CPP_MRUBY_FULL=$RUNNER_TEMP/bc2cpp-full/host" >> "$GITHUB_ENV"
          echo "BC2CPP_MRUBY_NOFIBER=$RUNNER_TEMP/bc2cpp-nofiber/host" >> "$GITHUB_ENV"
          echo "BC2CPP_BUILD_INCLUDE=$RUNNER_TEMP/bc2cpp-full/host/include" >> "$GITHUB_ENV"

      # The world's registry: every check in the policy is scheduled somewhere (checks.list included).
      - name: Check bc2cpp registrations
        working-directory: build/bc2cpp/rpg-maker-clone
        run: ruby scripts/ci/check_registry.rb

      - name: Run bc2cpp checks
        timeout-minutes: 30
        working-directory: build/bc2cpp/rpg-maker-clone
        run: |
          unset LD
          ruby scripts/ci/timed_checks.rb --shard ${{ matrix.shard }}/3 < scripts/bc2cpp/checks.list > "$RUNNER_TEMP/bc2cpp-checks.sh"
          source "$RUNNER_TEMP/bc2cpp-checks.sh"

      - name: Upload the snapshot record
        if: always() && inputs.mrbc_rb == 'record'
        uses: actions/upload-artifact@v4
        with:
          name: mrbc-record-checks-${{ matrix.shard }}
          path: ${{ runner.temp }}/mrbc-record-checks-${{ matrix.shard }}.txt
          if-no-files-found: ignore

  # nfcxx (the EDG front end) against clang inside bc2cpp: both AST producers (return kinds, and the host program's main_ast roots) and both
  # preprocessors (and the analysis headers' presym ids) on the pinned world's mruby, and the C++ Fiber check compiled with nfcxx (tests/bc2cpp/run_nfcxx_parity.sh, docs/notes/nfcxx-ast.md). The
  # toolchain action restores build/edg and build/qbe from the cache that ci.yml's build job saves (same keys,
  # so the checkout path must stay the same). The AST front end (scripts/setup-libclang-edg.sh) is a separate EDG
  # configuration, cached below. The checkout takes only the submodules those need.
  nfcxx-clang-parity:
    needs: bc2cpp-changes
    if: github.event_name != 'schedule' && needs.bc2cpp-changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      NFCXX_PARITY_FIBER: "1"
    steps:
      - uses: actions/checkout@v7

      - name: EDG and QBE sources
        run: git submodule update --init --depth 1 3rd/edg 3rd/qbe

      # clang: the oracle of the parity checks (nfcxx is the default AST producer, preprocessor and host compiler wherever it is
      # built; clang stays installed only here, and is the fallback elsewhere). bison, gperf, autoconf, automake and libtool: the fork's mruby build
      # (the Fiber check).
      - uses: ./.github/actions/toolchain
        with:
          packages: clang bison gperf autoconf automake libtool

      # Ruby 4.0 ships the Prism 1.x and RBS 4.x that bc2cpp is written against (see the world job).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # build/libclang-edg, keyed as ci.yml keys the Path B harness: the EDG revision and what the build reads.
      - name: AST front end cache key
        id: libclang-key
        run: echo "edg=$(git rev-parse HEAD:3rd/edg)" >> "$GITHUB_OUTPUT"

      - name: Restore the AST front end
        id: libclang-edg
        uses: actions/cache@v6
        with:
          path: build/libclang-edg
          key: libclang-edg-${{ runner.os }}-${{ runner.arch }}-${{ steps.libclang-key.outputs.edg }}-${{ hashFiles('be/nfcxx_decl.c', 'be/nfcxx_ast.c', 'be/nfcxx_edg_entry.c', 'scripts/setup-libclang-edg.sh', 'scripts/build-libclang-edg.sh', 'scripts/setup-edg.sh') }}

      - name: Build the AST front end
        if: steps.libclang-edg.outputs.cache-hit != 'true'
        run: LIBCLANG_EDG_IN_PROCESS=0 scripts/setup-libclang-edg.sh

      - name: nfcxx against clang (AST producers, main_ast, preprocessors, C++ Fiber)
        run: tests/bc2cpp/run_nfcxx_parity.sh

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # A full self build is intentionally requested through workflow_dispatch;
  # the fast artifact checks above run on ordinary changes.
  self-aot:
    if: github.event_name == 'workflow_dispatch' && inputs.self_aot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NFCXX_BACKEND: gcc
      RUBYOPT: --yjit
      BC2CPP_SCCACHE: "0"
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v7
      - name: EDG sources
        run: git submodule update --init --depth 1 3rd/edg
      - uses: ./.github/actions/toolchain
        with:
          packages: clang bison gperf autoconf automake libtool
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # The pinned world (tests/bc2cpp/fetch.sh) is the same for every job and shard that fetches it, and fetch.sh
      # reuses a checkout at the same pin. The cache is keyed on fetch.sh, which holds the pin and the submodule list.
      - name: Restore the pinned world
        uses: actions/cache@v6
        with:
          path: build/bc2cpp/rpg-maker-clone
          key: bc2cpp-world-${{ runner.os }}-full-${{ hashFiles('tests/bc2cpp/fetch.sh') }}

      - name: Pinned fixture world
        run: BC2CPP_WORLD_FULL=1 tests/bc2cpp/world.sh
      - name: CRuby 4 + YJIT compiles bc2cpp; nfcxx builds its output
        run: bundle exec scripts/setup-bc2cpp-self.sh > "$RUNNER_TEMP/bc2cpp-self-path"
      - name: Translated entries, emitter parity and generated-code behavior
        env:
          BC2CPP_REQUIRE_SELF_AOT: "1"
          BC2CPP_RUNNER_MRBC_MODE: verify
        run: |
          export BC2CPP_MRUBY_RUNNER=$(cat "$RUNNER_TEMP/bc2cpp-self-path")
          export MRBC="$GITHUB_WORKSPACE/build/bc2cpp-self/bootstrap/bc2cpp-runner/bin/mrbc"
          export CXX="$GITHUB_WORKSPACE/nfcxx"
          bundle exec ruby --yjit tests/bc2cpp/runner_generation.rb
      - name: Self-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bc2cpp-self-build
          path: |
            build/bc2cpp-self/*.log
            build/bc2cpp-self/generation/*.json
            build/bc2cpp-self/generation/*.log
          if-no-files-found: ignore
