name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      # sccache stores compiler outputs in the GitHub Actions cache.
      SCCACHE_GHA_ENABLED: "true"
      # CMake reads these when configuring the EDG build (scripts/setup-edg.sh).
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build gcc g++ python3 ruby rake clang

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build EDG front end
        run: scripts/setup-edg.sh

      - name: Build QBE and cproc
        run: scripts/setup-qbe.sh

      - name: Test (QBE backend)
        run: NFCXX_BACKEND=qbe tests/run.sh

      - name: Test (gcc backend)
        run: NFCXX_BACKEND=gcc tests/run.sh

      - name: Real-world check (tinyxml2)
        run: tests/realworld/run.sh

      - name: Real-world check (nlohmann/json, both backends, output compared with host g++)
        run: tests/realworld/run_json.sh

      - name: Real-world check ({fmt}, gcc backend, header-only and compiled; output compared with host g++)
        run: tests/realworld/run_fmt.sh

      - name: Trace output (Perfetto JSON, both backends)
        run: tests/trace/run.sh

      - name: C inputs (both backends)
        run: tests/c/run.sh

      - name: nfcc drop-in cc mode (both backends)
        run: tests/c/cc-mode.sh

      - name: nfceval run-time eval library and nfcxx -shared (both backends)
        run: tests/eval/run.sh

      - name: mruby scripts (byte-identical to the Python originals)
        run: tests/mruby/run.sh

      - name: sccache stats
        if: always()
        run: sccache --show-stats
