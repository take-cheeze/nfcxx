name: Hexagon

# Hexagon checks (docs/notes/hexagon.md). Kept out of the main CI job, and run only when a change
# can affect them: the EDG front end that generates the C, the Hexagon harness (tests/hexagon/flatlink.rb
# runs on the mruby interpreter, scripts/mrb.rb), the test cases it runs, or the workflow itself.
# Runs nightly (schedule) and on demand too (workflow_dispatch).
on:
  schedule:
    - cron: "41 3 * * *"   # nightly, UTC (qemu-hexagon checks, see the header above)
  push:
    branches: [main]
    paths:
      - "3rd/edg"
      - "be/**"
      - "scripts/setup-edg.sh"
      - "scripts/setup-edg-hexagon.sh"
      - "scripts/setup-pathb.sh"
      - "scripts/gen-c-target.rb"
      - "scripts/hexagon-predef.rb"
      - "scripts/mrb.rb"
      - "scripts/setup-mruby.sh"
      - "scripts/mruby-tool-config.rb"
      - "scripts/pathb-dump.rb"
      - "scripts/pathb-hvx-emit.rb"
      - "tests/hexagon/**"
      - "tests/cases/**"
      - "tests/pathb-hvx/**"
      - ".github/workflows/hexagon.yml"
  pull_request:
    paths:
      - "3rd/edg"
      - "be/**"
      - "scripts/setup-edg.sh"
      - "scripts/setup-edg-hexagon.sh"
      - "scripts/setup-pathb.sh"
      - "scripts/gen-c-target.rb"
      - "scripts/hexagon-predef.rb"
      - "scripts/mrb.rb"
      - "scripts/setup-mruby.sh"
      - "scripts/mruby-tool-config.rb"
      - "scripts/pathb-dump.rb"
      - "scripts/pathb-hvx-emit.rb"
      - "tests/hexagon/**"
      - "tests/cases/**"
      - "tests/pathb-hvx/**"
      - ".github/workflows/hexagon.yml"
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hexagon:
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # ruby and rake only bootstrap the mruby build (scripts/setup-mruby.sh); python3 is not needed here.
      - uses: ./.github/actions/toolchain
        with:
          packages: ruby rake
          qbe: "false"

      - name: Build the mruby interpreter (runs tests/hexagon/flatlink.rb)
        run: scripts/setup-mruby.sh

      - name: Install clang-19 and qemu-user (Hexagon)
        run: sudo apt-get install -y --no-install-recommends clang-19 qemu-user-static

      - name: Hexagon struct layout (EDG stand-in target vs clang's Hexagon ABI)
        run: CLANG=clang-19 tests/hexagon/layout.sh

      - name: Hexagon checks (open toolchain, clang-19 + qemu-hexagon)
        run: CLANG=clang-19 QEMU_HEXAGON=qemu-hexagon-static tests/hexagon/run.sh

  hexagon-target:
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # ruby and rake bootstrap the mruby build and hexagon-predef.rb (scripts/setup-mruby.sh); python3 is not needed here.
      - uses: ./.github/actions/toolchain
        with:
          packages: ruby rake
          qbe: "false"

      - name: Install clang-19 and qemu-user (Hexagon)
        run: sudo apt-get install -y --no-install-recommends clang-19 qemu-user-static

      - name: Hexagon EDG cache key
        id: hexagon-key
        run: echo "edg=$(git rev-parse HEAD:3rd/edg)" >> "$GITHUB_OUTPUT"

      # build/edg-hex-base is rebuilt from scratch on every run (setup-edg.sh wipes
      # it), so only the compiler outputs are cached.
      - name: Restore the Hexagon EDG (linux_hexagon target)
        id: hexagon-edg
        uses: actions/cache@v6
        with:
          path: build/edg-hex
          key: hexagon-edg-${{ runner.os }}-${{ steps.hexagon-key.outputs.edg }}-${{ hashFiles('scripts/setup-edg.sh', 'scripts/setup-edg-hexagon.sh', 'scripts/hexagon-predef.rb', '3rd/edg/cmake/macro-conf/support/target/linux_riscv32/base.cmakedef') }}
          restore-keys: |
            hexagon-edg-${{ runner.os }}-

      - name: Build the Hexagon EDG (linux_hexagon target)
        run: scripts/setup-edg-hexagon.sh

      - name: Build the mruby interpreter (runs tests/hexagon/flatlink.rb)
        run: scripts/setup-mruby.sh

      - name: Hexagon struct layout (linux_hexagon target vs clang's Hexagon ABI)
        run: EDG_BUILD=$PWD/build/edg-hex EDG_BASE=$PWD/build/edg-hex-base CLANG=clang-19 EDG_TARGET=linux_hexagon tests/hexagon/layout.sh

      - name: Hexagon checks on the linux_hexagon target (open toolchain, clang-19 + qemu-hexagon)
        run: EDG_BUILD=$PWD/build/edg-hex EDG_BASE=$PWD/build/edg-hex-base CLANG=clang-19 QEMU_HEXAGON=qemu-hexagon-static EDG_TARGET=linux_hexagon tests/hexagon/run.sh

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  pathb-hvx:
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ./.github/actions/toolchain
        with:
          packages: ruby rake
          qbe: "false"

      - name: Path B harness cache key
        id: pathb-key
        run: echo "edg=$(git rev-parse HEAD:3rd/edg)" >> "$GITHUB_OUTPUT"

      - name: Restore the Path B harness
        id: harness
        uses: actions/cache@v6
        with:
          path: build/pathb
          key: pathb-${{ runner.os }}-${{ steps.pathb-key.outputs.edg }}-${{ hashFiles('be/**', 'scripts/setup-pathb.sh') }}

      - name: Build the Path B harness
        if: steps.harness.outputs.cache-hit != 'true'
        run: scripts/setup-pathb.sh

      - name: Build the mruby interpreter (runs scripts/mrb.rb)
        run: scripts/setup-mruby.sh

      - name: Install clang-19 and qemu-user (Hexagon)
        run: sudo apt-get install -y --no-install-recommends clang-19 qemu-user-static

      - name: Path B IR to C+HVX checks (open toolchain, clang-19 + qemu-hexagon)
        run: CLANG=clang-19 QEMU_HEXAGON=qemu-hexagon-static tests/pathb-hvx/run.sh

      - name: sccache stats
        if: always()
        run: sccache --show-stats
