name: Hexagon

# Hexagon checks (docs/notes/hexagon.md). Kept out of the main CI job, and run only when a change
# can affect them: the EDG front end that generates the C, the Hexagon harness, the test cases it
# runs, or the workflow itself. Runs on demand too (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - "3rd/edg"
      - "scripts/setup-edg.sh"
      - "scripts/gen-c-target.sh"
      - "tests/hexagon/**"
      - "tests/cases/**"
      - ".github/workflows/hexagon.yml"
  pull_request:
    paths:
      - "3rd/edg"
      - "scripts/setup-edg.sh"
      - "scripts/gen-c-target.sh"
      - "tests/hexagon/**"
      - "tests/cases/**"
      - ".github/workflows/hexagon.yml"
  workflow_dispatch:

jobs:
  hexagon:
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build gcc g++ python3

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build EDG front end
        run: scripts/setup-edg.sh

      - name: Install clang-19 and qemu-user (Hexagon)
        run: sudo apt-get install -y --no-install-recommends clang-19 qemu-user-static

      - name: Hexagon checks (open toolchain, clang-19 + qemu-hexagon)
        run: CLANG=clang-19 QEMU_HEXAGON=qemu-hexagon-static tests/hexagon/run.sh

      - name: sccache stats
        if: always()
        run: sccache --show-stats
