name: Hexagon

# Hexagon checks (docs/notes/hexagon.md). Kept out of the main CI job, and run only when a change
# can affect them: the EDG front end that generates the C, the Hexagon harness (tests/hexagon/flatlink.rb
# runs on the mruby interpreter, scripts/mrb), the test cases it runs, or the workflow itself.
# Runs nightly (schedule) and on demand too (workflow_dispatch).
on:
  schedule:
    - cron: "41 3 * * *"   # nightly, UTC (qemu-hexagon checks, see the header above)
  push:
    branches: [main]
    paths:
      - "3rd/edg"
      - "scripts/setup-edg.sh"
      - "scripts/gen-c-target.sh"
      - "scripts/mrb"
      - "scripts/setup-mruby.sh"
      - "scripts/mruby-tool-config.rb"
      - "tests/hexagon/**"
      - "tests/cases/**"
      - ".github/workflows/hexagon.yml"
  pull_request:
    paths:
      - "3rd/edg"
      - "scripts/setup-edg.sh"
      - "scripts/gen-c-target.sh"
      - "scripts/mrb"
      - "scripts/setup-mruby.sh"
      - "scripts/mruby-tool-config.rb"
      - "tests/hexagon/**"
      - "tests/cases/**"
      - ".github/workflows/hexagon.yml"
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hexagon:
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # ruby and rake only bootstrap the mruby build (scripts/setup-mruby.sh); python3 is not needed here.
      - uses: ./.github/actions/toolchain
        with:
          packages: ruby rake
          qbe: "false"

      - name: Build the mruby interpreter (runs tests/hexagon/flatlink.rb)
        run: scripts/setup-mruby.sh

      - name: Install clang-19 and qemu-user (Hexagon)
        run: sudo apt-get install -y --no-install-recommends clang-19 qemu-user-static

      - name: Hexagon struct layout (EDG stand-in target vs clang's Hexagon ABI)
        run: CLANG=clang-19 tests/hexagon/layout.sh

      - name: Hexagon checks (open toolchain, clang-19 + qemu-hexagon)
        run: CLANG=clang-19 QEMU_HEXAGON=qemu-hexagon-static tests/hexagon/run.sh

      - name: sccache stats
        if: always()
        run: sccache --show-stats
