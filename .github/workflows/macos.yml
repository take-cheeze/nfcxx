name: CI (macOS)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Apple Silicon runner: the EDG front end, then the gcc-backend test suites (the same checks the Linux jobs run). The QBE
# back end gets its own job once its macOS support is on main. build/ holds absolute paths, so the caches are keyed by the runner's OS and architecture.
jobs:
  gcc:
    name: macOS arm64 (gcc backend, Apple clang)
    runs-on: macos-15
    env:
      NFCXX_BACKEND: gcc
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Tools
        run: brew install ccache ninja cmake

      - name: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-arm64-${{ hashFiles('scripts/setup-edg.sh', 'scripts/setup-qbe.sh', 'scripts/*.patch') }}-${{ github.run_id }}
          restore-keys: ccache-macos-arm64-

      - name: EDG front end
        run: scripts/setup-edg.sh

      - name: Test suites
        run: |
          tests/run.sh
          tests/lib/run.sh
          tests/builtins/run.sh
          tests/trace/run.sh
          tests/c/run.sh
          tests/c/cc-mode.sh
          tests/cxx-driver/run.sh

      - name: ccache stats
        if: always()
        run: ccache -s || true
