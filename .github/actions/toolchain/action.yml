name: Toolchain
description: >
  Install the build tools, set up sccache, and provide build/edg (the EDG front end) and, optionally, build/qbe
  and build/pathb-ldrt. Each is restored from the Actions cache when its inputs are unchanged and built
  otherwise, so one workflow run (or one push) pays for the build and every other job and workflow reuses it. The
  caller sets SCCACHE_GHA_ENABLED and CMAKE_*_COMPILER_LAUNCHER, as before.

inputs:
  cache-prefix:
    description: Optional cache namespace for callers using a different runner image or toolchain ABI.
    default: ""
  packages:
    description: Extra apt packages, space separated.
    default: ""
  qbe:
    description: Also provide QBE (scripts/setup-qbe.sh).
    default: "true"

runs:
  using: composite
  steps:
    - name: Install build tools
      shell: bash
      # apt-get update exits non-zero when one source fails (the runner image has a Microsoft source that some runners are
      # refused, 403). The Ubuntu lists are still fetched and the packages come from them, so the update's status is not
      # a reason to stop: the install's status is. A mirror that stalls (a run hung on azure.archive.ubuntu.com for an hour)
      # is bounded by the timeout: the update is killed and the install runs from the lists already fetched.
      run: |
        sudo timeout 300 apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=1 update || echo "apt-get update: a source failed or timed out (see above); installing from the lists that were fetched"
        sudo apt-get install -y --no-install-recommends cmake ninja-build gcc g++ ${{ inputs.packages }}

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    # The key holds everything the build reads: the submodule revisions and the scripts/patches/sources that
    # setup-*.sh use. build/ holds absolute paths, so every job keeps the same checkout path (GITHUB_WORKSPACE).
    - name: Cache keys
      id: key
      shell: bash
      run: |
        echo "edg=$(git rev-parse HEAD:3rd/edg)-${{ hashFiles('scripts/setup-edg.sh') }}" >> "$GITHUB_OUTPUT"
        echo "qbe=$(git rev-parse HEAD:3rd/qbe)-${{ hashFiles('scripts/setup-qbe.sh', 'scripts/qbe-uninit-slot.patch', 'scripts/qbe-wflag.patch', 'scripts/qbe-empty-align.patch', 'scripts/pathb-ldrt', 'be/nfcxx_ldrt.c') }}" >> "$GITHUB_OUTPUT"

    - name: Restore the EDG front end
      id: edg
      uses: actions/cache@v6
      with:
        path: |
          build/edg
          build/edg-base
        key: ${{ inputs.cache-prefix }}edg-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.edg }}

    - name: Build EDG front end
      if: steps.edg.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/setup-edg.sh

    - name: Restore QBE
      id: qbe
      if: inputs.qbe == 'true'
      uses: actions/cache@v6
      with:
        path: |
          build/qbe
          build/pathb-ldrt
        key: ${{ inputs.cache-prefix }}qbe-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.qbe }}

    - name: Build QBE
      if: inputs.qbe == 'true' && steps.qbe.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/setup-qbe.sh
