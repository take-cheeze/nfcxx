# The entries of the `test` job's matrix in ci.yml (one job per entry). They live here, not in the workflow, so that the
# selection step (scripts/ci-scope.rb, job pathb-changes) can leave entries out and the leg never starts: an entry with
# `gcc_only: true` exists only for the gcc backend, which runs on pushes to main only (GCC_BACKEND, top of ci.yml). Every
# other key is read by the job's steps as matrix.<key> (go, interp, onnx, suite, group, backend, pathb, dotnet, run, name).
# Mixed entries (qbe and gcc in one `run`) guard their gcc lines with `[ "$GCC_BACKEND" = 1 ]`.
- name: cases (Path B and gcc backends)
  pathb: true   # NFCXX_BACKEND=pathb needs the Path B harness
  run: |
    NFCXX_BACKEND=pathb tests/run.sh
    if [ "$GCC_BACKEND" = 1 ]; then NFCXX_BACKEND=gcc tests/run.sh; fi
- name: C++11 and C++14 language feature probes (Path B and gcc)
  pathb: true   # FEATURE_ROUTES=pathb needs the Path B harness
  run: |
    tests/cpp-features/self-test.sh
    tests/upstream/self-test.sh
    FEATURE_ROUTES="pathb$([ "$GCC_BACKEND" = 1 ] && echo " gcc")" FEATURE_REQUIRE_PASS=1 tests/cpp-features/run.sh
- name: mruby scripts
  # No Path B harness on purpose: with it, tests/mruby's pathb-qbe-emit oracle (tests/mruby/oracle) refuses file-scope asm
  # (exit 3) that scripts/pathb-qbe-emit.rb accepts (exit 0).
  run: tests/mruby/run.sh
- name: CIL backend (C programs as .NET assemblies, run with dotnet 8)
  dotnet: true
  run: |
    scripts/setup-cil.sh
    scripts/setup-pathb.sh
    tests/cil/run.sh
    tests/pathb-cil/run.sh
- name: freestanding lib, builtins, trace, C inputs, cc mode, driver options, determinism, float-to-integer
  pathb: true   # tests/nfcc/run.sh needs the Path B harness
  run: |
    tests/lib/run.sh
    tests/target/run.sh
    tests/builtins/run.sh
    tests/trace/run.sh
    tests/c/run.sh
    tests/c/cc-mode.sh
    tests/cxx-driver/run.sh
    tests/nfcc/run.sh
    tests/pathb-kernel/run.sh
    tests/pathb-i386/run.sh
    tests/pathb-i386/realmode.sh
    tests/determinism/run.sh
    tests/float-to-int/run.sh
- name: --cosmo (routing, then the real cosmocc from scripts/setup-cosmo.sh)
  env:
    COSMOCC_SHA256: ${{ vars.COSMOCC_SHA256 }}
  run: |
    scripts/setup-cosmo.sh
    tests/cosmo/run.sh
- name: real-world tinyxml2, nlohmann/json, doctest (gcc and Path B), and {fmt}
  pathb: true   # run.sh, run_json.sh and run_doctest.sh build with Path B
  run: |
    tests/realworld/run.sh
    tests/realworld/run_json.sh
    tests/realworld/run_doctest.sh
    tests/realworld/run_fmt.sh
- name: C++ modules (Path B, qbe and gcc backends)
  pathb: true   # tests/modules/run.sh runs the Path B backend, which is the default for modules (docs/notes/modules.md)
  run: |
    tests/modules/run.sh
- name: multi-TU, EH shim, nfceval, nfcffi, bundled libraries, call ABI
  pathb: true   # tests/ehshim/run.sh builds with Path B
  run: |
    tests/multi-tu/run.sh
    tests/ehshim/run.sh
    tests/eh-unwind/run.sh
    tests/eval/run.sh
    tests/ffi/run.sh
    tests/bundle/run.sh
    tests/call-abi/run.sh
# The system unwinder runs the cleanups of a throw (NFCXX_EH_UNWIND=1; tests/ehshim/unwind_members.cpp). gcc: gcc's
# landing pads; tests/ehshim runs on Path B.
- name: EH unwinder (gcc and Path B backends, NFCXX_EH_UNWIND=1)
  pathb: true   # tests/ehshim/run.sh builds with Path B
  run: |
    if [ "$GCC_BACKEND" = 1 ]; then
      NFCXX_EH_UNWIND=1 NFCXX_BACKEND=gcc tests/ehshim/run.sh
      NFCXX_EH_UNWIND=1 NFCXX_BACKEND=gcc tests/c/run.sh
    fi
    NFCXX_EH_UNWIND=1 tests/ehshim/run.sh   # gcc and Path B per file (the BACKENDS: lines), foreign/ on both
# The nfcpoly, nfcast, uop and mruby suites run in parallel, one entry per back end where the script takes one
# (NFCXX_BACKEND); each entry sets up only what it needs (go and onnx flags below). Same tests as one job before.
- name: nfcpoly host (Path B backend)
  pathb: true   # NFCXX_BACKEND=pathb needs the Path B harness
  go: true
  interp: true
  suite: poly
  backend: pathb
  run: NFCXX_BACKEND=pathb tests/poly/run.sh
- name: nfcpoly host (gcc backend)
  gcc_only: true
  go: true
  interp: true
  suite: poly
  backend: gcc
  run: NFCXX_BACKEND=gcc tests/poly/run.sh
- name: nfcpoly Go under AddressSanitizer
  go: true
  run: tests/poly/asan-go.sh
- name: nfcast engine and tier (Path B backend)
  pathb: true   # NFCXX_BACKEND=pathb needs the Path B harness
  run: NFCXX_BACKEND=pathb tests/ast/run.sh
- name: nfcast engine and tier (gcc backend)
  gcc_only: true
  run: NFCXX_BACKEND=gcc tests/ast/run.sh
- name: uop core and numpy (Path B backend)
  pathb: true   # NFCXX_BACKEND=pathb needs the Path B harness
  onnx: true
  suite: uop
  group: core
  backend: pathb
  run: UOP_ONLY="test test_ut test_shaping test_np np_compat" NFCXX_BACKEND=pathb tests/uop/run.sh
- name: uop onnx and runtimes (Path B backend)
  pathb: true   # NFCXX_BACKEND=pathb needs the Path B harness
  onnx: true
  suite: uop
  group: onnx
  backend: pathb
  run: UOP_ONLY="test_nn test_onnx test_sym test_grad test_ort test_tinygrad test_cgen" NFCXX_BACKEND=pathb tests/uop/run.sh
- name: uop poly languages (Path B backend)
  pathb: true   # NFCXX_BACKEND=pathb needs the Path B harness
  go: true
  onnx: true
  interp: true
  suite: uop
  group: poly
  backend: pathb
  run: NFCXX_BACKEND=pathb tests/uop/run_poly.sh
- name: uop core and numpy (gcc backend)
  gcc_only: true
  onnx: true
  suite: uop
  group: core
  backend: gcc
  run: UOP_ONLY="test test_ut test_shaping test_np np_compat" NFCXX_BACKEND=gcc tests/uop/run.sh
- name: uop onnx and runtimes (gcc backend)
  gcc_only: true
  onnx: true
  suite: uop
  group: onnx
  backend: gcc
  run: UOP_ONLY="test_nn test_onnx test_sym test_grad test_ort test_tinygrad test_cgen" NFCXX_BACKEND=gcc tests/uop/run.sh
- name: uop poly languages (gcc backend)
  gcc_only: true
  go: true
  onnx: true
  interp: true
  suite: uop
  group: poly
  backend: gcc
  run: NFCXX_BACKEND=gcc tests/uop/run_poly.sh
- name: C++ PTX emitter (build) and GPU kernel on the PTX interpreter
  run: |
    ninja -C tools/pathb-ptx-emit
    tests/gpu/run_interp.sh
- name: AddressSanitizer (gcc and Path B backends)
  pathb: true   # ASAN_BACKEND=pathb needs the Path B harness
  run: |
    if [ "$GCC_BACKEND" = 1 ]; then tests/asan/run.sh; fi
    ASAN_BACKEND=pathb tests/asan/run.sh
# The Path B harness comes from the cache that the pathb-build job saves (same key), and is built here on a miss.
- name: Path B e-graph (goldens, cases, CLI; scripts/pathb-egraph.rb)
  pathb: true
  run: tests/pathb-egraph/run.sh
