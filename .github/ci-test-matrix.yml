# The entries of the `test` job's matrix in ci.yml (one job per entry). They live here, not in the workflow, so that the
# selection step (scripts/ci-scope.rb, job pathb-changes) can leave entries out and the leg never starts: an entry with
# `gcc_only: true` exists only for the gcc backend, which runs on pushes to main only (GCC_BACKEND, top of ci.yml). Every
# other key is read by the job's steps as matrix.<key> (go, interp, onnx, suite, group, backend, pathb, dotnet, run, name).
# Mixed entries (qbe and gcc in one `run`) guard their gcc lines with `[ "$GCC_BACKEND" = 1 ]`.
- name: cases (QBE and gcc backends)
  run: |
    NFCXX_BACKEND=qbe tests/run.sh
    if [ "$GCC_BACKEND" = 1 ]; then NFCXX_BACKEND=gcc tests/run.sh; fi
- name: C++11 and C++14 language feature probes (qbe and gcc), mruby scripts
  run: |
    tests/cpp-features/self-test.sh
    tests/upstream/self-test.sh
    FEATURE_ROUTES="qbe$([ "$GCC_BACKEND" = 1 ] && echo " gcc")" FEATURE_REQUIRE_PASS=1 tests/cpp-features/run.sh
    tests/mruby/run.sh
- name: CIL backend (C programs as .NET assemblies, run with dotnet 8)
  dotnet: true
  run: |
    scripts/setup-cil.sh
    scripts/setup-pathb.sh
    tests/cil/run.sh
    tests/pathb-cil/run.sh
- name: freestanding lib, builtins, trace, C inputs, cc mode, driver options, determinism, float-to-integer
  run: |
    tests/lib/run.sh
    tests/target/run.sh
    tests/builtins/run.sh
    tests/trace/run.sh
    tests/c/run.sh
    tests/c/cc-mode.sh
    tests/cxx-driver/run.sh
    tests/determinism/run.sh
    tests/float-to-int/run.sh
- name: --cosmo (routing, then the real cosmocc from scripts/setup-cosmo.sh)
  env:
    COSMOCC_SHA256: ${{ vars.COSMOCC_SHA256 }}
  run: |
    scripts/setup-cosmo.sh
    tests/cosmo/run.sh
- name: real-world tinyxml2, nlohmann/json, and {fmt}
  run: |
    tests/realworld/run.sh
    tests/realworld/run_json.sh
    tests/realworld/run_fmt.sh
- name: multi-TU, modules, EH shim, nfceval, nfcffi, bundled libraries, call ABI
  run: |
    tests/multi-tu/run.sh
    tests/modules/run.sh
    tests/ehshim/run.sh
    tests/eh-unwind/run.sh
    tests/eval/run.sh
    tests/ffi/run.sh
    tests/bundle/run.sh
    tests/call-abi/run.sh
# The system unwinder runs the cleanups of a throw (NFCXX_EH_UNWIND=1; tests/ehshim/unwind_members.cpp). gcc: gcc's
# landing pads; qbe: cproc's cleanup lowering to landing pads (qbe.c, ehcleanupobj).
- name: EH unwinder (gcc and qbe backends, NFCXX_EH_UNWIND=1)
  run: |
    if [ "$GCC_BACKEND" = 1 ]; then
      NFCXX_EH_UNWIND=1 NFCXX_BACKEND=gcc tests/ehshim/run.sh
      NFCXX_EH_UNWIND=1 NFCXX_BACKEND=gcc tests/c/run.sh
    fi
    NFCXX_EH_UNWIND=1 NFCXX_BACKEND=qbe tests/ehshim/run.sh
    NFCXX_EH_UNWIND=1 NFCXX_BACKEND=qbe tests/c/run.sh
# The nfcpoly, nfcast, uop and mruby suites run in parallel, one entry per back end where the script takes one
# (NFCXX_BACKEND); each entry sets up only what it needs (go and onnx flags below). Same tests as one job before.
- name: nfcpoly host (QBE backend)
  go: true
  interp: true
  suite: poly
  backend: qbe
  run: NFCXX_BACKEND=qbe tests/poly/run.sh
- name: nfcpoly host (gcc backend)
  gcc_only: true
  go: true
  interp: true
  suite: poly
  backend: gcc
  run: NFCXX_BACKEND=gcc tests/poly/run.sh
- name: nfcpoly Go under AddressSanitizer
  go: true
  run: tests/poly/asan-go.sh
- name: nfcast engine and tier (QBE backend)
  run: NFCXX_BACKEND=qbe tests/ast/run.sh
- name: nfcast engine and tier (gcc backend)
  gcc_only: true
  run: NFCXX_BACKEND=gcc tests/ast/run.sh
- name: uop core and numpy (QBE backend)
  onnx: true
  suite: uop
  group: core
  backend: qbe
  run: UOP_ONLY="test test_ut test_shaping test_np np_compat" NFCXX_BACKEND=qbe tests/uop/run.sh
- name: uop onnx and runtimes (QBE backend)
  onnx: true
  suite: uop
  group: onnx
  backend: qbe
  run: UOP_ONLY="test_nn test_onnx test_sym test_grad test_ort test_tinygrad test_cgen" NFCXX_BACKEND=qbe tests/uop/run.sh
- name: uop poly languages (QBE backend)
  go: true
  onnx: true
  interp: true
  suite: uop
  group: poly
  backend: qbe
  run: NFCXX_BACKEND=qbe tests/uop/run_poly.sh
- name: uop core and numpy (gcc backend)
  gcc_only: true
  onnx: true
  suite: uop
  group: core
  backend: gcc
  run: UOP_ONLY="test test_ut test_shaping test_np np_compat" NFCXX_BACKEND=gcc tests/uop/run.sh
- name: uop onnx and runtimes (gcc backend)
  gcc_only: true
  onnx: true
  suite: uop
  group: onnx
  backend: gcc
  run: UOP_ONLY="test_nn test_onnx test_sym test_grad test_ort test_tinygrad test_cgen" NFCXX_BACKEND=gcc tests/uop/run.sh
- name: uop poly languages (gcc backend)
  gcc_only: true
  go: true
  onnx: true
  interp: true
  suite: uop
  group: poly
  backend: gcc
  run: NFCXX_BACKEND=gcc tests/uop/run_poly.sh
- name: C++ PTX emitter (build) and GPU kernel on the PTX interpreter
  run: |
    ninja -C tools/pathb-ptx-emit
    tests/gpu/run_interp.sh
- name: AddressSanitizer (gcc and qbe backends)
  run: |
    if [ "$GCC_BACKEND" = 1 ]; then tests/asan/run.sh; fi
    ASAN_BACKEND=qbe tests/asan/run.sh
# The Path B harness comes from the cache that the pathb-build job saves (same key), and is built here on a miss.
- name: Path B e-graph (goldens, cases, CLI; scripts/pathb-egraph.rb)
  pathb: true
  run: tests/pathb-egraph/run.sh
